  // ════════════════════════════════════════
  //  TXT MODE
  // ════════════════════════════════════════
  async function loadTxt(file) {
    invisModeOn = false;
    const zwBtn = document.getElementById('invisToggleBtn');
    if(zwBtn) zwBtn.classList.remove('active');
    resetEditor();

    const rawText = await file.text();
    txtContent = rawText;
    isTxtMode = true;
    currentFileName = file.name;

    // 파일명에서 제목 추출 (확장자 제거)
    const cleanTitle = file.name.replace(/\.txt$/i, '').replace(/[_\-]/g,' ').trim();

    // 챕터 파싱
    txtChapters = parseTxtChapters(rawText, cleanTitle);

    // 가상 파일 등록 (에디터 열기용)
    const TXT_KEY = '__txt__/' + file.name;
    files[TXT_KEY] = rawText;
    fileTypes[TXT_KEY] = 'txt-main';
    fileTimestamps[TXT_KEY] = new Date(file.lastModified);

    topFname.textContent = `${currentFileName} · ${formatBytes(file.size)} · TXT`;
    setSaveDisabled(false);
    // 검색 버튼만 활성화 (TOC 버튼은 TXT에서 불필요)
    btnSearch.disabled = false;

    renderTxtTree();
    openFile(TXT_KEY);
  }

  function parseTxtChapters(text, cleanTitle) {
    // 불가시 공백만 정규화 (줄 압축 금지 — 압축하면 startLine이 에디터와 어긋남)
    text = text.replace(/[\u2000-\u200B\u3000\uFEFF]/g, ' ');
    const lines = text.split('\n');

    // 파일 전체에 "n화" 패턴 존재 여부 미리 체크
    const hasHwaInFile = lines.some(line =>
      /^제?\s*\d+\s*화(?:\s*\(?\s*(?:완결|완|마침|完|fin|Complete)\s*\)?)?(?:[\.\s].*)?$/.test(line.trim())
    );

    const escapedTitle = cleanTitle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const CHAPTER_RE = new RegExp(
      '^(' +
        escapedTitle + ' .*|' +
        '제?\\s*[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+\\s*화(?:\\s*\\(?\\s*(?:완결|완|Complete)\\s*\\)?)?(?:[.\\s].*)?|' +
        '[^\\w\\s]{1,3}\\s*[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+\\s*화(?:\\s*\\(?\\s*(?:완결|완|Complete)\\s*\\)?)?(?:[.\\s].*)?|' +
        '(?:제|第)?\\s*[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+\\s*(?:장|章)(?:[.\\s].*)?|' +
        '.*외전(?:\\s*[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+(?:-[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+)?)?(?:\\s*화)?(?:[.\\s].*)?|' +
        '[^\\w\\s]*(?:프롤로그|[Pp]rologue)(?:\\s*[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+)?(?:\\s*화)?(?:[.\\s].*)?|' +
        '[^\\w\\s]*(?:에필로그|[Ee]pilogue)(?:\\s*[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+)?(?:\\s*화)?(?:[.\\s].*)?|' +
        '(?:서장|序章|[Ii]ntroduction)(?:\\s*[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+)?(?:[.\\s].*)?|' +
        '(?:종장|終章|[Ff]inal\\s*[Cc]hapter)(?:\\s*[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+)?(?:[.\\s].*)?|' +
        '(?:후일담|後日譚|[Ss]ide\\s*[Ss]tory|[Ss]tory)(?:\\s*[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+)?(?:[.\\s].*)?|' +
        '(?:번외|番外|[Ee]xtra)(?:\\s*[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+)?(?:[.\\s].*)?|' +
        '(?:[<〈【])?작가\\s*후기(?:[>〉】])?(?:\\s*[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+)?(?:[.\\s].*)?|' +
        '[^\\w\\s]*(?:[Cc]hapter)(?:\\s*[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+)?(?:\\s*화)?(?:[.\\s].*)?|' +
        '[^\\w\\s]*(?:[Ee]pisode)(?:\\s*[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+)?(?:\\s*화)?(?:[.\\s].*)?|' +
        '[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+(?:-[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+)?\\. (?:.*)?|' +
        '-\\s*[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+\\s*-|' +
        '^\\s*#.*|' +
        '^【[^】]+】' +
      ')\\s*$',
      'i'
    );

    const ENDING_RE = /^-?\s*.{0,15}(?:完|마침|[Ff]in\.?|완결)\s*-?$/i;
    const H2_RE = new RegExp(
      '^(' +
        '[^\\d]*[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+\\s*화(?:\\s*\\(?\\s*(?:완결|완|Complete)\\s*\\)?)?(?:[.\\s].*)?|' +
        '.*외전(?:[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ\\s]*(?:화|권)?)?(?:[.\\s].*)?|' +
        '[^\\w\\s]*(?:프롤로그|[Pp]rologue|에필로그|[Ee]pilogue|[Ee]pisode|후일담|번외|서장|종장).*' +
      ')\\s*$',
      'i'
    );

    const chapters = [];
    let currentTitles = [];
    let startLine = 0;
    let pendingStartLine = 0;

    const flush = (endLine) => {
      if(currentTitles.length > 0) {
        chapters.push({
          title: currentTitles[0],
          subtitles: currentTitles.slice(1),
          startLine: pendingStartLine,
          endLine: endLine - 1
        });
      } else if(endLine > 0) {
        chapters.push({
          title: '(목차 없음)',
          subtitles: [],
          startLine: 0,
          endLine: endLine - 1
        });
      }
    };

    for(let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if(!CHAPTER_RE.test(line)) continue;
      if(ENDING_RE.test(line)) continue;
      // 완결 표시가 포함된 챕터 제목인지 체크 (화/권/장이 있는 경우는 챕터임)
      const hasChapterWord = /(?:화|권|장|chapter|part)\b/i.test(line);
      if(!hasChapterWord && ENDING_RE.test(line)) continue;

      if(hasHwaInFile) {
        if(H2_RE.test(line)) {
          // 새 챕터 시작
          flush(i);
          currentTitles = [line];
          pendingStartLine = i;
        } else {
          if(!currentTitles.length) {
            // 첫 제목 전 내용이 있으면 flush
            if(i > 0) flush(i);
            currentTitles = [line];
            pendingStartLine = i;
          } else {
            currentTitles.push(line);
          }
        }
      } else {
        flush(i);
        currentTitles = [line];
        pendingStartLine = i;
      }
    }
    flush(lines.length);

    // 챕터를 하나도 못 찾은 경우 → 전체를 하나로
    if(!chapters.length && lines.some(l => l.trim())) {
      chapters.push({ title: '(전체)', subtitles: [], startLine: 0, endLine: lines.length - 1 });
    }

    return chapters;
  }

  function renderTxtTree() {
    // 사이드바 헤더 레이블 변경
    const sidebarHeaderSpan = document.querySelector('.sidebar-header > span');
    if(sidebarHeaderSpan) sidebarHeaderSpan.textContent = 'CHAPTERS';

    let html = `<div class="file-group">
      <div class="file-group-label">📄 TXT · ${txtChapters.length}개 챕터</div>
      <div class="file-group-items">`;
    txtChapters.forEach((ch, idx) => {
      const sub = ch.subtitles && ch.subtitles.length ? ` <span style="color:var(--text-dim);font-size:9px;">${ch.subtitles[0]}</span>` : '';
      html += `<div class="file-item txt-chapter-item" data-chidx="${idx}" title="${escHtml(ch.title)}" style="padding-left:20px;">
        <span class="icon">📌</span>
        <span class="file-name">${escHtml(ch.title)}${sub}</span>
        <span class="timestamp" style="font-size:9px;color:var(--text-dim);">${ch.startLine+1}</span>
      </div>`;
    });
    html += `</div></div>`;
    fileTree.innerHTML = html;

    fileTree.querySelectorAll('.txt-chapter-item').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.chidx);
        scrollToTxtChapter(idx);
        // 활성 표시
        fileTree.querySelectorAll('.txt-chapter-item').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
      });
    });
  }

  function scrollToTxtChapter(chIdx) {
    const editorEl = document.getElementById('txtEditor');
    const wrap     = document.getElementById('txtContentWrap');
    const lineNums = document.getElementById('txtLineNums');
    if(!editorEl || !wrap) return;
    const ch = txtChapters[chIdx];
    if(!ch) return;

    const divs = editorEl.querySelectorAll(':scope > div');
    const targetDiv = divs[ch.startLine];
    if(!targetDiv) return;

    // 1) 커서 먼저 이동
    editorEl.focus();
    const range = document.createRange();
    const sel   = window.getSelection();
    range.setStart(targetDiv, 0);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);

    // 2) focus로 인한 스크롤 재배치가 끝난 뒤 덮어쓰기
    requestAnimationFrame(() => {
      const scrollTarget = Math.max(0, targetDiv.offsetTop - 48);
      wrap.scrollTop = scrollTarget;
      if(lineNums) lineNums.scrollTop = scrollTarget;
    });
  }

  // ─── SORT ───
  document.getElementById('sortSpine').addEventListener('click', () => { sortMode = 'spine'; renderFileTree(); updateSortButtons(); });
  document.getElementById('sortType').addEventListener('click', () => { sortMode = 'type'; renderFileTree(); updateSortButtons(); });
  document.getElementById('sortName').addEventListener('click', () => { sortMode = 'name'; renderFileTree(); updateSortButtons(); });

  function updateSortButtons() {
    document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
    if(sortMode === 'spine') document.getElementById('sortSpine').classList.add('active');
    else if(sortMode === 'type') document.getElementById('sortType').classList.add('active');
    else document.getElementById('sortName').classList.add('active');
  }

  // ─── LOAD EPUB ───
  async function loadEpub(file) {
    invisModeOn = false;
    const zwBtn = document.getElementById('invisToggleBtn');
    if(zwBtn) zwBtn.classList.remove('active');
    resetEditor();

    zip = await JSZip.loadAsync(file);
    files = {}; fileTypes = {}; fileTimestamps = {}; modifiedFiles.clear();
    openTabs = []; activeTab = null; spine = []; tocEntries = [];
    tocFilePath = null; opfPath = null; currentFileName = file.name;

    for(const [path, zipEntry] of Object.entries(zip.files)) {
      if(zipEntry.dir) continue;
      fileTimestamps[path] = zipEntry.date;
      const ext = getExt(path).toLowerCase();
      const textExts = ['html','xhtml','htm','xml','xhml','xhm','opf','ncx','css','txt','svg','js','json'];
      if(textExts.includes(ext)) {
        files[path] = await zipEntry.async('string');
        detectFileType(path);
      } else {
        files[path] = await zipEntry.async('uint8array');
        fileTypes[path] = getBinaryType(path);
      }
    }

    parseEpubStructure();
    renderFileTree();
    renderTabs();
    topFname.textContent = `${currentFileName} · ${formatBytes(file.size)}`;
    setSaveDisabled(false); setControlsDisabled(false);
  }

  function detectFileType(path) {
    const content = files[path];
    const lower = path.toLowerCase();
    if(lower.endsWith('.opf') || (typeof content === 'string' && content.includes('<package'))) fileTypes[path] = 'opf';
    else if(lower.endsWith('.ncx')) fileTypes[path] = 'ncx';
    else if(lower.endsWith('.html') || lower.endsWith('.xhtml') || lower.endsWith('.htm')) fileTypes[path] = 'html';
    else if(lower.endsWith('.css')) fileTypes[path] = 'css';
    else if(lower.endsWith('.xml')) fileTypes[path] = 'xml';
    else fileTypes[path] = 'text';
  }

  function getBinaryType(path) {
    const ext = getExt(path).toLowerCase();
    if(['jpg','jpeg','png','gif','svg','webp'].includes(ext)) return 'image';
    if(['ttf','otf','woff','woff2'].includes(ext)) return 'font';
    return 'binary';
  }

  // ─── PARSE EPUB ───
  function parseEpubStructure() {
    const containerPath = 'META-INF/container.xml';
    if(files[containerPath]) {
      const match = files[containerPath].match(/full-path\s*=\s*["']([^"']+)["']/i);
      if(match) opfPath = match[1];
    }
    if(!opfPath) { for(const p in fileTypes) { if(fileTypes[p] === 'opf') { opfPath = p; break; } } }
    if(!opfPath) { for(const p in files) { if(p.toLowerCase().endsWith('.opf')) { opfPath = p; fileTypes[p] = 'opf'; break; } } }
    if(!opfPath || !files[opfPath]) return;

    const content = files[opfPath];
    const opfDir = opfPath.includes('/') ? opfPath.split('/').slice(0,-1).join('/') + '/' : '';
    const idrefs = [...content.matchAll(/<itemref\s+[^>]*idref\s*=\s*["']([^"']+)["']/gi)].map(m => m[1]);
    const idToHref = {};
    for(const m of content.matchAll(/<item[^>]+id\s*=\s*["']([^"']+)["'][^>]+href\s*=\s*["']([^"']+)["']/gi)) idToHref[m[1]] = m[2];
    for(const m of content.matchAll(/<item[^>]+href\s*=\s*["']([^"']+)["'][^>]+id\s*=\s*["']([^"']+)["']/gi)) idToHref[m[2]] = m[1];
    spine = idrefs.map(id => idToHref[id] ? (opfDir + idToHref[id]).replace('//','/') : null).filter(Boolean);

    for(const p in files) {
      if(p.toLowerCase().includes('nav.xhtml') || p.toLowerCase().includes('toc.ncx')) {
        tocFilePath = p; parseToc(p); break;
      }
    }
  }

  function parseToc(path) {
    const content = files[path];
    tocEntries = [];
    const tocDir = path.includes('/') ? path.split('/').slice(0,-1).join('/') + '/' : '';
    if(path.endsWith('.ncx')) {
      for(const m of content.matchAll(/<navLabel>\s*<text>([^<]+)<\/text>\s*<\/navLabel>\s*<content\s+src="([^"]+)"/gi))
        tocEntries.push({ label: m[1], content: tocDir + m[2], level: 1 });
    } else {
      for(const m of content.matchAll(/<a\s+href="([^"]+)">([^<]+)<\/a>/gi))
        tocEntries.push({ label: m[2], content: tocDir + m[1], level: 1 });
    }
  }

  // ════════════════════════════════════════
  //  PC 컨텍스트 메뉴 & 롱프레스 삭제
  // ════════════════════════════════════════
  const ctxMenu = document.getElementById('ctxMenu');
  let ctxTargetPath = null;

  function hideCtxMenu() { ctxMenu.classList.remove('show'); ctxTargetPath = null; }

  document.addEventListener('click', hideCtxMenu);
  document.addEventListener('keydown', e => { if(e.key === 'Escape') hideCtxMenu(); });

  document.getElementById('ctxOpen').addEventListener('click', () => {
    if(ctxTargetPath) openFile(ctxTargetPath);
    hideCtxMenu();
  });
  document.getElementById('ctxDelete').addEventListener('click', () => {
    if(ctxTargetPath) deleteFile(ctxTargetPath);
    hideCtxMenu();
  });

  function showCtxMenu(e, path) {
    e.preventDefault();
    e.stopPropagation();
    ctxTargetPath = path;
    const x = Math.min(e.clientX, window.innerWidth - 160);
    const y = Math.min(e.clientY, window.innerHeight - 90);
    ctxMenu.style.left = x + 'px';
    ctxMenu.style.top  = y + 'px';
    ctxMenu.classList.add('show');
  }

  // ─── RENDER FILE TREE ───
  function renderFileTree() {
    if(isTxtMode) { renderTxtTree(); return; }
    if(!Object.keys(files).length) return;
    const allFiles = Object.keys(files).map(p => ({ path: p, type: fileTypes[p] || 'other' }));
    let html = '';

    if(sortMode === 'spine') {
      const spineFiles = spine.filter(p => files[p]);
      const otherFiles = allFiles.filter(f => !spine.includes(f.path)).sort((a,b) => naturalSort(a.path, b.path));
      spineFiles.forEach((path, idx) => { html += renderFileItem({ path, type: fileTypes[path] }, idx + 1); });
      if(otherFiles.length) {
        html += `<div class="file-group-label">기타 파일 (${otherFiles.length})</div>`;
        otherFiles.forEach(f => { html += renderFileItem(f); });
      }
    } else if(sortMode === 'name') {
      allFiles.sort((a,b) => naturalSort(a.path, b.path));
      allFiles.forEach(f => { html += renderFileItem(f); });
    } else {
      const groups = {};
      const groupOrder = ['html','css','image','xml','opf','ncx','font','text','binary'];
      const groupNames = { html:'Text', css:'Styles', image:'Images', xml:'XML', opf:'OPF', ncx:'NCX', font:'Fonts', text:'Etc', binary:'Binary' };
      allFiles.forEach(f => { if(!groups[f.type]) groups[f.type] = []; groups[f.type].push(f); });
      groupOrder.forEach(type => {
        if(!groups[type]) return;
        groups[type].sort((a,b) => naturalSort(a.path, b.path));
        html += `<div class="file-group">
          <div class="file-group-label" onclick="this.parentElement.classList.toggle('collapsed')">📁 ${groupNames[type] || type.toUpperCase()} (${groups[type].length})</div>
          <div class="file-group-items">${groups[type].map(f => renderFileItem(f)).join('')}</div>
        </div>`;
      });
    }

    fileTree.innerHTML = html;
    const deletableTypes = ['html','css','image'];

    fileTree.querySelectorAll('.file-item').forEach(el => {
      const path = el.dataset.path;
      const ftype = fileTypes[path];

      el.addEventListener('click', () => openFile(path));

      if(deletableTypes.includes(ftype)) {
        // ── 모바일: touchstart 롱프레스 (600ms) ──
        let pressTimer = null;
        el.addEventListener('touchstart', () => {
          pressTimer = setTimeout(() => { pressTimer = null; deleteFile(path); }, 600);
        }, { passive: true });
        el.addEventListener('touchend',  () => { if(pressTimer) { clearTimeout(pressTimer); pressTimer = null; } });
        el.addEventListener('touchmove', () => { if(pressTimer) { clearTimeout(pressTimer); pressTimer = null; } });

        // ── PC: 우클릭 & 마우스 롱프레스 (600ms) ──
        el.addEventListener('contextmenu', e => showCtxMenu(e, path));

        let mouseTimer = null;
        el.addEventListener('mousedown', e => {
          if(e.button !== 0) return; // 좌클릭만
          mouseTimer = setTimeout(() => { mouseTimer = null; showCtxMenu(e, path); }, 600);
        });
        el.addEventListener('mouseup',   () => { if(mouseTimer) { clearTimeout(mouseTimer); mouseTimer = null; } });
        el.addEventListener('mouseleave',() => { if(mouseTimer) { clearTimeout(mouseTimer); mouseTimer = null; } });
      }
    });
  }

  function renderFileItem(f, spineIndex = null) {
    const icon = getFileIcon(f.type);
    const name = f.path.split('/').pop();
    const ts = fileTimestamps[f.path];
    const timestamp = ts ? formatTimestamp(ts) : '';
    const isActive  = activeTab === f.path;
    const isModified = modifiedFiles.has(f.path);
    let classes = 'file-item';
    if(isActive)   classes += ' active';
    if(isModified) classes += ' modified';
    const spineHtml = spineIndex ? `<span class="spine-num">${spineIndex}</span>` : '';
    const modIcon   = isModified ? '🔴 ' : '';
    return `<div class="${classes}" data-path="${f.path}">
      ${spineHtml}<span class="icon">${modIcon}${icon}</span>
      <span class="file-name">${name}</span>
      <span class="timestamp">${timestamp}</span>
    </div>`;
  }

  function getFileIcon(type) {
    const icons = { html:'📄', css:'🎨', image:'🖼️', xml:'📋', opf:'📦', ncx:'📑', font:'🔤', text:'📝', binary:'🗳' };
    return icons[type] || '📄';
  }

  // ─── DELETE FILE ───
  function deleteFile(path) {
    const name = path.split('/').pop();
    if(!confirm(`"${name}" 파일을 삭제하시겠습니까?\n(저장 시 EPUB에서 제거됩니다)`)) return;

    if(zip && zip.files[path]) zip.remove(path);

    if(opfPath && files[opfPath]) {
      const opfDir = opfPath.includes('/') ? opfPath.split('/').slice(0,-1).join('/') + '/' : '';
      const relPath = path.startsWith(opfDir) ? path.slice(opfDir.length) : path;
      let opf = files[opfPath];
      const itemIds = [];
      opf = opf.replace(/<item\s[^>]*href\s*=\s*["'][^"']*["'][^>]*\/>/gi, m => {
        const hrefMatch = m.match(/href\s*=\s*["']([^"']+)["']/i);
        const idMatch   = m.match(/\bid\s*=\s*["']([^"']+)["']/i);
        if(hrefMatch && (hrefMatch[1] === relPath || hrefMatch[1].replace(/^.*\//,'') === name)) {
          if(idMatch) itemIds.push(idMatch[1]);
          return '';
        }
        return m;
      });
      itemIds.forEach(id => {
        opf = opf.replace(new RegExp(`<itemref\\s[^>]*idref\\s*=\\s*["']${id}["'][^>]*\/>`,'gi'), '');
      });
      files[opfPath] = opf;
      modifiedFiles.add(opfPath);
    }

    delete files[path];
    delete fileTypes[path];
    delete fileTimestamps[path];
    modifiedFiles.delete(path);
    spine = spine.filter(p => p !== path);
    closeTab(path);
    renderFileTree();
  }

  // ─── TABS ───
  function renderTabs() {
    editorTabs.innerHTML = openTabs.map(tab => {
      const isActive   = tab.path === activeTab;
      const isModified = modifiedFiles.has(tab.path);
      // TXT 모드면 파일명으로 표시
      const name = (fileTypes[tab.path] === 'txt-main') ? currentFileName : tab.path.split('/').pop();
      let classes = 'tab';
      if(isActive)   classes += ' active';
      if(isModified) classes += ' modified';
      return `<div class="${classes}" data-path="${tab.path}">
        <span class="tab-name">${name}</span>
        <span class="close" onclick="event.stopPropagation();closeTab('${tab.path.replace(/'/g,"\\'")}')">&times;</span>
      </div>`;
    }).join('');

    editorTabs.querySelectorAll('.tab').forEach(el => {
      el.addEventListener('click', () => { activeTab = el.dataset.path; renderTabs(); renderEditor(); renderFileTree(); updateStatus(); });
    });
  }

  function closeTab(path) {
    openTabs = openTabs.filter(t => t.path !== path);
    if(activeTab === path) activeTab = openTabs.length ? openTabs[openTabs.length-1].path : null;
    renderTabs();
    if(activeTab) renderEditor();
    else editorWrap.innerHTML = `<div class="empty-state"><div class="big-icon">📖</div><p>파일을 선택하세요</p></div>`;
    renderFileTree();
    updateStatus();
  }

  function openFile(path) {
    if(!openTabs.find(t => t.path === path)) openTabs.push({ path });
    activeTab = path;
    if(isMobile) closeDrawer();
    renderTabs(); renderEditor(); renderFileTree(); updateStatus();
  }

  // ─── RENDER EDITOR ───
  function renderEditor() {
    if(!activeTab) return;
    const type = fileTypes[activeTab];
    if(type === 'image') renderImagePreview();
    else if(type === 'txt-main') renderTextEditor(true);
    else if(['html','xml','opf','ncx','css','text'].includes(type)) renderTextEditor();
    else editorWrap.innerHTML = `<div class="empty-state"><p>바이너리 파일은 편집할 수 없습니다</p></div>`;
  }

  // ─── 제로폭 오버레이 ───
  function countInvisChars(text) { const m = text.match(INVIS_REGEX); return m ? m.length : 0; }
  function countBookTokens(text) {
    BOOK_TOKEN_REGEX.lastIndex = 0;
    const m = text.match(BOOK_TOKEN_REGEX);
    return m ? m.length : 0;
  }
  function updateButtonState(text) {
    const btn = document.getElementById('invisToggleBtn');
    const el  = document.getElementById('invisCount');
    if(!btn || !el) return;
    const zwCount = countInvisChars(text);
    const tkCount = countBookTokens(text);
    if(zwCount > 0) {
      el.textContent = zwCount; el.style.display = 'inline';
      el.classList.remove('token-count'); btn.classList.remove('has-token');
    } else if(tkCount > 0) {
      el.textContent = tkCount; el.style.display = 'inline';
      el.classList.add('token-count'); btn.classList.add('has-token');
    } else {
      el.style.display = 'none';
      el.classList.remove('token-count'); btn.classList.remove('has-token');
    }
  }

  function buildOverlayHtml(text) {
    const tokenRanges = [];
    let m;
    BOOK_TOKEN_REGEX.lastIndex = 0;
    while((m = BOOK_TOKEN_REGEX.exec(text)) !== null)
      tokenRanges.push({ start: m.index, end: m.index + m[0].length, raw: m[0] });

    let result = '';
    for(let i = 0; i < text.length; i++) {
      const range = tokenRanges.find(r => r.start === i);
      if(range) {
        let inner = '';
        for(let j = 0; j < range.raw.length; j++) {
          const c = range.raw[j];
          if(c === '&') inner += '&amp;'; else if(c === '<') inner += '&lt;'; else if(c === '>') inner += '&gt;'; else inner += c;
        }
        result += `<span class="token-highlight" title="⚠️ book-token 감지">${inner}</span>`;
        i += range.raw.length - 1;
        continue;
      }
      const ch = text[i];
      if(INVIS_CHARS[ch]) {
        const label = INVIS_CHARS[ch];
        const code = ch.codePointAt(0).toString(16).toUpperCase().padStart(4,'0');
        result += `<span class="invis-badge" title="U+${code} ${label}">${label}</span>`;
      } else if(ch === '&') result += '&amp;';
      else if(ch === '<') result += '&lt;';
      else if(ch === '>') result += '&gt;';
      else result += ch;
    }
    return result;
  }

  function updateOverlay() {
    const editor  = document.getElementById('codeEditor');
    const overlay = document.getElementById('invisOverlay');
    if(!editor || !overlay) return;
    if(!invisModeOn) { overlay.classList.add('hidden'); updateInvisCount(0, false); return; }
    const content = editor.value;
    const count   = countInvisChars(content);
    overlay.innerHTML = buildOverlayHtml(content);
    overlay.classList.remove('hidden');
    overlay.scrollTop  = editor.scrollTop;
    overlay.scrollLeft = editor.scrollLeft;
    updateInvisCount(count, true);
  }

  function updateInvisCount(count, show) {
    const el = document.getElementById('invisCount');
    if(!el) return;
    el.textContent = count;
    el.style.display = (show && count > 0) ? 'inline' : 'none';
  }

  function toggleInvisMode() {
    invisModeOn = !invisModeOn;
    const btn = document.getElementById('invisToggleBtn');
    btn.classList.toggle('active', invisModeOn);
    const editor = document.getElementById('codeEditor');
    if(editor) {
      editor.style.color      = invisModeOn ? 'transparent' : '';
      editor.style.caretColor = invisModeOn ? 'var(--text)' : '';
      updateOverlay();
    } else { updateInvisCount(0, false); }
  }

  function renderTextEditor(isTxt = false) {
    if(isTxt) { renderTxtEditor(); return; }

    // ── 일반 코드 에디터 (textarea + 줄번호) ──
    const content = files[activeTab] || '';
    editorWrap.innerHTML = `
      <div class="editor-container">
        <div class="editor-inner">
          <div class="line-numbers" id="lineNumbers"></div>
          <textarea class="code-editor" id="codeEditor" wrap="off">${escHtml(content)}</textarea>
          <div class="invis-overlay hidden" id="invisOverlay" aria-hidden="true"></div>
        </div>
      </div>`;

    const editor   = document.getElementById('codeEditor');
    const overlay  = document.getElementById('invisOverlay');
    const lineNums = document.getElementById('lineNumbers');

    function updateLineNumbers() {
      const count = editor.value.split('\n').length;
      let t = '';
      for(let i = 1; i <= count; i++) t += i + '\n';
      lineNums.textContent = t;
      lineNums.scrollTop = editor.scrollTop;
    }
    updateLineNumbers();

    editor.addEventListener('scroll', () => {
      lineNums.scrollTop = editor.scrollTop;
      if(overlay) { overlay.scrollTop = editor.scrollTop; overlay.scrollLeft = editor.scrollLeft; }
    });
    editor.addEventListener('input', () => {
      files[activeTab] = editor.value;
      updateLineNumbers();
      if(!modifiedFiles.has(activeTab)) { modifiedFiles.add(activeTab); renderTabs(); renderFileTree(); updateStatus(); }
      if(invisModeOn) updateOverlay();
    });
    editor.addEventListener('keydown', e => {
      if(e.key === 'Tab') {
        e.preventDefault();
        const s = editor.selectionStart, en = editor.selectionEnd;
        editor.value = editor.value.substring(0, s) + '  ' + editor.value.substring(en);
        editor.selectionStart = editor.selectionEnd = s + 2;
        updateLineNumbers();
        if(invisModeOn) updateOverlay();
      }
    });

    if(invisModeOn) {
      editor.style.color = 'transparent'; editor.style.caretColor = 'var(--text)';
      updateOverlay();
    } else { updateButtonState(content); }
  }

  // ── TXT 전용: contenteditable + 줄바꿈 시각적 줄번호 ──
  function renderTxtEditor() {
    const content = files[activeTab] || '';
    editorWrap.innerHTML = `
      <div class="editor-container">
        <div class="txt-editor-wrap">
          <div class="txt-line-numbers" id="txtLineNums"></div>
          <div class="txt-content-wrap" id="txtContentWrap">
            <div class="txt-editor" id="txtEditor" contenteditable="true" spellcheck="false"></div>
          </div>
        </div>
      </div>`;

    const editorEl = document.getElementById('txtEditor');
    const lineNums = document.getElementById('txtLineNums');
    const wrap     = document.getElementById('txtContentWrap');

    function setContent(text) {
      const lines = text.split('\n');
      editorEl.innerHTML = lines.map(l =>
        '<div>' + (l ? escHtml(l) : '<br>') + '</div>'
      ).join('');
    }

    function updateLineNumbers() {
      const divs = editorEl.querySelectorAll(':scope > div');
      const lh = parseFloat(getComputedStyle(editorEl).lineHeight) || 25.2;
      let html = '';
      divs.forEach((div, i) => {
        const h = Math.max(div.offsetHeight, lh);
        html += `<span style="height:${h}px;line-height:${h}px;">${i + 1}</span>`;
      });
      lineNums.innerHTML = html;
      lineNums.scrollTop = wrap.scrollTop;
    }

    function getText() {
      return Array.from(editorEl.querySelectorAll(':scope > div'))
        .map(d => {
          // <br>만 있으면 빈 줄
          if(d.innerHTML === '<br>' || d.innerHTML === '') return '';
          return d.innerText.replace(/\n$/, '');
        }).join('\n');
    }

    setContent(content);
    requestAnimationFrame(() => {
      updateLineNumbers();
    });

    wrap.addEventListener('scroll', () => { lineNums.scrollTop = wrap.scrollTop; });

    const ro = new ResizeObserver(() => updateLineNumbers());
    ro.observe(editorEl);

    editorEl.addEventListener('input', () => {
      updateLineNumbers();
      const text = getText();
      files[activeTab] = text;
      txtContent = text;
      if(!modifiedFiles.has(activeTab)) { modifiedFiles.add(activeTab); renderTabs(); updateStatus(); }
      const cleanTitle = currentFileName.replace(/\.txt$/i, '').replace(/[_\-]/g,' ').trim();
      txtChapters = parseTxtChapters(txtContent, cleanTitle);
      renderTxtTree();
      fileTree.querySelectorAll('.txt-chapter-item').forEach(e => e.classList.remove('active'));
    });
  }

  function renderImagePreview() {
    const data = files[activeTab];
    const ext = getExt(activeTab).toLowerCase();
    const mimeMap = { jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', gif:'image/gif', svg:'image/svg+xml', webp:'image/webp' };
    const mime = mimeMap[ext] || 'image/png';
    let src;
    if(data instanceof Uint8Array) { const blob = new Blob([data], {type: mime}); src = URL.createObjectURL(blob); }
    else { src = 'data:' + mime + ';base64,' + btoa(data); }
    const sizeStr = data instanceof Uint8Array ? formatBytes(data.byteLength) : formatBytes(data.length);
    const safePath = activeTab.replace(/'/g, "\\'");
    const safeFname = activeTab.split('/').pop().replace(/'/g, "\\'");
    editorWrap.innerHTML = `
      <div class="img-preview-wrap">
        <img src="${src}" alt="preview" onload="updateImageDimensions(this)"/>
        <div class="img-meta" id="imgMeta">${activeTab} · ${sizeStr} · ${ext.toUpperCase()}</div>
        <div class="img-actions">
          <button onclick="replaceImage()">교체</button>
          <button onclick="downloadImage('${src}','${safeFname}')">다운로드</button>
          <button class="danger" onclick="deleteFileConfirm('${safePath}')">🗑️ 삭제</button>
        </div>
      </div>`;
  }

  function deleteFileConfirm(path) { deleteFile(path); }

  function updateImageDimensions(img) {
    const meta = document.getElementById('imgMeta');
    if(meta && img.naturalWidth && img.naturalHeight) meta.textContent += ` · ${img.naturalWidth}×${img.naturalHeight}`;
  }

  function replaceImage() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*';
    input.onchange = async () => {
      const file = input.files[0]; if(!file) return;
      files[activeTab] = new Uint8Array(await file.arrayBuffer());
      modifiedFiles.add(activeTab);
      renderEditor(); renderTabs(); renderFileTree(); updateStatus();
    };
    input.click();
  }

  function downloadImage(src, fname) {
    const a = document.createElement('a'); a.href = src; a.download = fname; a.click();
  }

  // ─── SAVE ───
  async function doSave() {
    if(isTxtMode) {
      // TXT 모드: 텍스트 파일로 저장
      const TXT_KEY = '__txt__/' + currentFileName;
      const content = files[TXT_KEY] || txtContent;
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = currentFileName; a.click();
      URL.revokeObjectURL(url);
      modifiedFiles.clear();
      renderTabs(); updateStatus();
      return;
    }
    if(!zip) return;
    const mimetimeTime = (zip.files['mimetype']?.date) ? zip.files['mimetype'].date : new Date();

    for(const path in files) {
      const options = {};
      options.date = (!modifiedFiles.has(path) && fileTimestamps[path]) ? fileTimestamps[path] : new Date();
      if(path === 'mimetype') {
        options.compression = 'STORE';
      } else {
        options.compression = 'DEFLATE';
        options.compressionOptions = { level: 6 };
      }
      zip.file(path, files[path], options);
    }

    Object.keys(zip.files).forEach(path => { if(zip.files[path].dir) zip.files[path].date = mimetimeTime; });
    if(zip.files['mimetype']) zip.files['mimetype'].date = mimetimeTime;

    const blob = await zip.generateAsync({ type:'blob', mimeType:'application/epub+zip', compression:'DEFLATE', compressionOptions:{ level:6 } });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = currentFileName; a.click();
    URL.revokeObjectURL(url);
    modifiedFiles.forEach(path => { fileTimestamps[path] = new Date(); });
    modifiedFiles.clear();
    renderTabs(); renderFileTree(); updateStatus();
  }

  btnSavePc.addEventListener('click', doSave);
  btnSaveMb.addEventListener('click', doSave);

  // ─── SEARCH ───
  function openSearchModal() {
    document.getElementById('searchModal').classList.add('show');
    document.getElementById('searchInput').focus();
    // TXT 모드면 필터 영역 숨김 (전체 검색만 의미 있음)
    const filterRow = document.querySelector('.filter-btns');
    if(filterRow) filterRow.style.display = isTxtMode ? 'none' : '';
    if(isTxtMode) setSearchFilter('all');
  }
  function closeSearchModal() { document.getElementById('searchModal').classList.remove('show'); renderFileTree(); renderTabs(); updateStatus(); }

  let searchFilter = 'all';
  function setSearchFilter(f) {
    searchFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  }
  function matchesFilter(path) {
    const lower = path.toLowerCase();
    if(searchFilter === 'html') return /\.(html|xhtml|xml|xhml|htm)$/.test(lower);
    if(searchFilter === 'css')  return lower.endsWith('.css');
    return true;
  }

  function performSearch() {
    const query = document.getElementById('searchInput').value.trim();
    if(!query) return;
    const caseSensitive = document.getElementById('caseSensitive').checked;
    const results = [];
    for(const [path, content] of Object.entries(files)) {
      if(typeof content !== 'string' || !matchesFilter(path)) continue;
      const lines = content.split('\n');
      lines.forEach((line, idx) => {
        const sl = caseSensitive ? line : line.toLowerCase();
        const sq = caseSensitive ? query : query.toLowerCase();
        if(sl.includes(sq)) results.push({ path, lineNum: idx + 1, text: line.trim().substring(0, 100) });
      });
    }
    document.getElementById('searchResultCount').textContent = `검색 결과: ${results.length}개`;
    let html = ''; let currentFile = '';
    results.forEach(r => {
      if(r.path !== currentFile) { currentFile = r.path; html += `<div class="search-result-item"><div class="file-header">📄 ${r.path}</div></div>`; }
      html += `<div class="search-result-item" onclick="openFileAtLine('${r.path.replace(/'/g,"\\'")}', ${r.lineNum})"><span class="line-info">Line ${r.lineNum}:</span> ${escHtml(r.text)}</div>`;
    });
    document.getElementById('searchResults').innerHTML = html || '<div style="padding:20px;text-align:center;color:var(--text-dim);">검색 결과가 없습니다</div>';
  }

  function openFileAtLine(path, lineNum) {
    closeSearchModal(); openFile(path);
    setTimeout(() => {
      const editor = document.getElementById('codeEditor');
      if(editor) {
        const lines = editor.value.split('\n');
        let pos = 0;
        for(let i = 0; i < lineNum - 1 && i < lines.length; i++) pos += lines[i].length + 1;
        editor.focus();
        editor.setSelectionRange(pos, pos + lines[lineNum-1].length);
        editor.scrollTop = (lineNum - 5) * 22;
      }
    }, 100);
  }

  document.addEventListener('keydown', e => {
    if((e.ctrlKey || e.metaKey) && e.key === 'f' && Object.keys(files).length) { e.preventDefault(); openSearchModal(); }
  });

  function replaceAllInFiles() {
    const searchText  = document.getElementById('searchInput').value;
    const replaceText = document.getElementById('replaceInput').value;
    if(!searchText) { alert('찾을 텍스트를 입력하세요'); return; }
    const caseSensitive = document.getElementById('caseSensitive').checked;
    if(!confirm(`"${searchText}"를 "${replaceText}"로 모두 바꾸시겠습니까?`)) return;

    let totalCount = 0, fileCount = 0;
    Object.keys(files).forEach(path => {
      if(!matchesFilter(path) || typeof files[path] !== 'string') return;
      let content = files[path]; let count = 0;
      if(caseSensitive) {
        const parts = content.split(searchText); count = parts.length - 1;
        if(count > 0) files[path] = parts.join(replaceText);
      } else {
        const regex = new RegExp(searchText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        const newContent = content.replace(regex, () => { count++; return replaceText; });
        if(count > 0) files[path] = newContent;
      }
      if(count > 0) { totalCount += count; fileCount++; modifiedFiles.add(path); }
    });

    if(totalCount > 0) {
      alert(`${fileCount}개 파일에서 ${totalCount}개 항목을 바꿨습니다`);
      if(activeTab && files[activeTab]) {
        const textarea = document.getElementById('codeEditor');
        if(textarea) { textarea.value = files[activeTab]; if(invisModeOn) updateOverlay(); }
      }
      renderFileTree(); renderTabs(); updateStatus(); performSearch();
    } else { alert(`"${searchText}"를 찾을 수 없습니다`); }
  }

  // ─── TOC ───
  function openTocModal() {
    newTocEntries = []; selectedNewTocIndex = -1;
    renderCurrentToc(); renderNewTocList();
    document.getElementById('tocModal').classList.add('show');
  }
  function closeTocModal() { document.getElementById('tocModal').classList.remove('show'); }

  function renderCurrentToc() {
    const container = document.getElementById('currentTocTree');
    if(!tocEntries.length) { container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim);">목차가 없습니다</div>'; return; }
    const levelIcons = ['🟥','🟧','🟨','🟩','🟦','🟪'];
    container.innerHTML = tocEntries.map(e => {
      const level = e.level || 1;
      return `<div class="toc-tree-item level-${level}">
        <span>${levelIcons[Math.min(level-1,5)]}</span>
        <span style="flex:1">${escHtml(e.label)}</span>
        <span style="font-size:10px;color:var(--text-dim)">${e.content.split('/').pop()}</span>
      </div>`;
    }).join('');
  }

  function renderNewTocList() {
    const container = document.getElementById('newTocList');
    if(!newTocEntries.length) { container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim);">목차를 불러오세요</div>'; return; }
    const levelIcons = ['🟥','🟧','🟨','🟩','🟦','🟪'];
    container.innerHTML = newTocEntries.map((e, idx) => {
      const level = e.level || 1;
      const indent   = '  '.repeat(level - 1);
      const selected = idx === selectedNewTocIndex ? ' selected' : '';
      return `<div class="new-toc-item${selected}" data-idx="${idx}" draggable="true">
        <span>${indent}${levelIcons[Math.min(level-1,5)]}</span>
        <span class="label">${escHtml(e.label)}</span>
        <span class="target">${e.content.split('/').pop()}</span>
        <span class="level-badge">Lv${level}</span>
      </div>`;
    }).join('');

    container.querySelectorAll('.new-toc-item').forEach(el => {
      el.addEventListener('click', () => { selectedNewTocIndex = parseInt(el.dataset.idx); renderNewTocList(); });
      el.addEventListener('dragstart', e => { el.classList.add('dragging'); e.dataTransfer.setData('text/plain', el.dataset.idx); });
      el.addEventListener('dragend',   () => el.classList.remove('dragging'));
      el.addEventListener('dragover',  e => e.preventDefault());
      el.addEventListener('drop', e => {
        e.preventDefault();
        const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
        const toIdx   = parseInt(el.dataset.idx);
        if(fromIdx !== toIdx) { const item = newTocEntries.splice(fromIdx, 1)[0]; newTocEntries.splice(toIdx, 0, item); selectedNewTocIndex = toIdx; renderNewTocList(); }
      });
    });
  }

  function loadOriginalToc() {
    if(!tocEntries.length) { alert('원본 목차가 없습니다.'); return; }
    newTocEntries = tocEntries.map(e => ({...e})); selectedNewTocIndex = -1; renderNewTocList();
    alert(`${newTocEntries.length}개의 목차 항목을 불러왔습니다.`);
  }

  function loadTocFromHtml() {
    if(!spine.length) { alert('spine 정보가 없습니다.'); return; }
    newTocEntries = [];
    spine.forEach(filePath => {
      if(!files[filePath] || typeof files[filePath] !== 'string') return;
      const content = files[filePath];
      const headingRegex = /<(h[1-6])[^>]*>(.*?)<\/\1>/gi;
      let match;
      while((match = headingRegex.exec(content)) !== null) {
        const level = parseInt(match[1][1]);
        const text  = match[2].replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
        if(text) newTocEntries.push({ label: text, content: filePath, level });
      }
      const classRegex = /<(\w+)\s+[^>]*class=["'][^"']*?(title|toc|chapter)[^"']*?["'][^>]*>(.*?)<\/\1>/gi;
      while((match = classRegex.exec(content)) !== null) {
        const text = match[3].replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
        if(text && !newTocEntries.find(e => e.label === text && e.content === filePath)) newTocEntries.push({ label: text, content: filePath, level: 1 });
      }
    });
    selectedNewTocIndex = -1; renderNewTocList();
    alert(`${newTocEntries.length}개의 목차 항목을 찾았습니다.`);
  }

  function loadTocFromFile() {
    if(!spine.length) { alert('spine 정보가 없습니다.'); return; }
    newTocEntries = [];
    spine.forEach(filePath => {
      if(!files[filePath] || typeof files[filePath] !== 'string') return;
      const content = files[filePath];
      const bodyMatch = content.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
      if(bodyMatch) {
        const tagMatch = bodyMatch[1].match(/<(\w+)[^>]*>([\s\S]*?)<\/\1>/);
        if(tagMatch) {
          const text = tagMatch[2].replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
          if(text.length >= 1) newTocEntries.push({ label: text.substring(0, 100), content: filePath, level: 1 });
        }
      }
    });
    selectedNewTocIndex = -1; renderNewTocList();
    alert(`${newTocEntries.length}개의 목차 항목을 찾았습니다.`);
  }

  function moveNewTocItem(dir) {
    if(selectedNewTocIndex < 0) return;
    const newIdx = selectedNewTocIndex + dir;
    if(newIdx < 0 || newIdx >= newTocEntries.length) return;
    const item = newTocEntries.splice(selectedNewTocIndex, 1)[0];
    newTocEntries.splice(newIdx, 0, item); selectedNewTocIndex = newIdx; renderNewTocList();
  }

  function changeNewTocLevel(dir) {
    if(selectedNewTocIndex < 0) return;
    const item = newTocEntries[selectedNewTocIndex];
    const newLevel = (item.level || 1) + dir;
    if(newLevel < 1 || newLevel > 6) return;
    item.level = newLevel; renderNewTocList();
  }

  function editNewTocLabel() {
    if(selectedNewTocIndex < 0) return;
    const item = newTocEntries[selectedNewTocIndex];
    const newLabel = prompt('새 제목:', item.label);
    if(newLabel !== null && newLabel.trim()) { item.label = newLabel.trim(); renderNewTocList(); }
  }

  function deleteNewTocItem() {
    if(selectedNewTocIndex < 0) return;
    if(!confirm('선택한 항목을 삭제하시겠습니까?')) return;
    newTocEntries.splice(selectedNewTocIndex, 1); selectedNewTocIndex = -1; renderNewTocList();
  }

  function applyNewToc() {
    if(!newTocEntries.length) { alert('적용할 목차가 없습니다.'); return; }
    if(!tocFilePath || !files[tocFilePath]) { alert('TOC 파일을 찾을 수 없습니다.'); return; }
    tocEntries = newTocEntries.map(e => ({...e}));
    if(tocFilePath.endsWith('.ncx')) rebuildNcxXml();
    else rebuildNavHtml();
    modifiedFiles.add(tocFilePath);
    renderTabs(); renderFileTree(); updateStatus(); closeTocModal();
    alert('목차가 갱신 되었습니다!');
  }

  function rebuildNcxXml() {
    const original = files[tocFilePath];
    const ncxDir = tocFilePath.includes('/') ? tocFilePath.split('/').slice(0,-1).join('/') + '/' : '';
    let playOrder = 0;
    function buildNavPoints(entries, startIdx, parentLevel) {
      let result = ''; let i = startIdx;
      while(i < entries.length) {
        const entry = entries[i];
        const level = entry.level || 1;
        if(level <= parentLevel) break;
        playOrder++;
        let relTarget = entry.content;
        if(relTarget.startsWith(ncxDir)) relTarget = relTarget.slice(ncxDir.length);
        const baseIndent = '  '.repeat(level);
        result += `${baseIndent}<navPoint id="navPoint-${playOrder}" playOrder="${playOrder}">\n`;
        result += `${baseIndent}  <navLabel><text>${escHtml(entry.label)}</text></navLabel>\n`;
        result += `${baseIndent}  <content src="${escHtml(relTarget)}"/>\n`;
        if(i + 1 < entries.length && (entries[i+1].level || 1) > level) {
          const childResult = buildNavPoints(entries, i+1, level);
          result += childResult.content; i = childResult.nextIdx - 1;
        }
        result += `${baseIndent}</navPoint>\n`; i++;
      }
      return { content: result, nextIdx: i };
    }
    const hierarchyResult = buildNavPoints(tocEntries, 0, 0);
    files[tocFilePath] = original.replace(/<navMap[^>]*>[\s\S]*?<\/navMap>/i, `<navMap>\n${hierarchyResult.content}</navMap>`);
  }

  function rebuildNavHtml() {
    const original = files[tocFilePath];
    const navDir = tocFilePath.includes('/') ? tocFilePath.split('/').slice(0,-1).join('/') + '/' : '';
    function buildNestedOl(entries, startIdx, parentLevel) {
      let html = ''; let i = startIdx;
      while(i < entries.length) {
        const entry = entries[i];
        const level = entry.level || 1;
        if(level <= parentLevel) break;
        let relTarget = entry.content;
        if(relTarget.startsWith(navDir)) relTarget = relTarget.slice(navDir.length);
        const indent = '      '.repeat(level);
        html += `${indent}<li>\n${indent}  <a href="${escHtml(relTarget)}">${escHtml(entry.label)}</a>\n`;
        if(i + 1 < entries.length && (entries[i+1].level || 1) > level) {
          html += `${indent}  <ol>\n`;
          const childResult = buildNestedOl(entries, i+1, level);
          html += childResult.content + `${indent}  </ol>\n`;
          i = childResult.nextIdx - 1;
        }
        html += `${indent}</li>\n`; i++;
      }
      return { content: html, nextIdx: i };
    }
    const result = buildNestedOl(tocEntries, 0, 0);
    const newOl = `<ol>\n${result.content}    </ol>`;
    const lower = original.toLowerCase();
    let olStart = lower.indexOf('<ol');
    if(olStart === -1) return;
    let depth = 0, olEnd = -1, i = olStart;
    while(i < original.length) {
      if(lower.startsWith('<ol', i)) { depth++; i += 3; }
      else if(lower.startsWith('</ol>', i)) { depth--; if(depth === 0) { olEnd = i + 5; break; } i += 5; }
      else { i++; }
    }
    if(olEnd === -1) return;
    files[tocFilePath] = original.slice(0, olStart) + newOl + original.slice(olEnd);
  }

  // ─── UTILS ───
  function getExt(path) { const p = path.split('.'); return p.length > 1 ? p[p.length-1] : ''; }
  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function formatBytes(b) { if(b < 1024) return b + ' B'; if(b < 1024*1024) return (b/1024).toFixed(1) + ' KB'; return (b/(1024*1024)).toFixed(2) + ' MB'; }
  function formatTimestamp(d) { if(!d) return ''; const pad = n => String(n).padStart(2,'0'); return `${String(d.getFullYear()).slice(2)}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  function naturalSort(a, b) { return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }); }

  function updateStatus() {
    if(isTxtMode && activeTab) {
      statusFile.textContent = currentFileName;
      statusType.textContent = 'TXT';
      statusModified.textContent = modifiedFiles.size ? `수정됨` : '';
      statusModified.className = modifiedFiles.size ? 'modified' : '';
      statusTimestamp.textContent = '—';
      const d = files[activeTab];
      statusSize.textContent = d ? formatBytes(new Blob([d]).size) : '—';
      return;
    }
    statusFile.textContent = activeTab || '—';
    statusType.textContent = activeTab ? (fileTypes[activeTab] || '—').toUpperCase() : '—';
    statusModified.textContent = modifiedFiles.size ? `${modifiedFiles.size}개 수정됨` : '';
    statusModified.className = modifiedFiles.size ? 'modified' : '';
    statusTimestamp.textContent = (activeTab && fileTimestamps[activeTab]) ? formatTimestamp(fileTimestamps[activeTab]) : '—';
    if(activeTab && files[activeTab]) {
      const d = files[activeTab];
      statusSize.textContent = formatBytes(d instanceof Uint8Array ? d.byteLength : new Blob([d]).size);
    } else { statusSize.textContent = '—'; }
  }

  // ─── INIT ───
  detectMode();

  // layout 높이를 JS로도 보정
  function fixLayoutHeight() {
    const topH    = document.querySelector('.topbar').offsetHeight;
    const statH   = document.querySelector('.statusbar').offsetHeight;
    document.querySelector('.layout').style.height = `calc(100dvh - ${topH}px - ${statH}px)`;
    document.body.style.height = '100dvh';
  }
  window.addEventListener('resize', fixLayoutHeight);
  fixLayoutHeight();
</script>
</body>
