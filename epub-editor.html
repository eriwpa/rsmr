<!DOCTYPE html>
<html lang="ko" class="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EPUB Editor v1.3.1</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&display=swap');

  :root {
    --bg: #f4f5f7;
    --bg2: #ffffff;
    --bg3: #eceef2;
    --bg-hover: #e2e5eb;
    --border: #d1d5df;
    --text: #3a3f52;
    --text-dim: #7b8299;
    --text-bright: #1e2130;
    --accent: #5a4fd4;
    --accent2: #5eead4;
    --accent-dim: rgba(90,79,212,0.1);
    --red: #dc2626;
    --green: #16a34a;
    --yellow: #d97706;
    --font-ui: 'Inter Tight', 'Malgun Gothic', sans-serif;
    --font-code: 'JetBrains Mono', monospace;
  }

  :root.dark {
    --bg: #0e0f11;
    --bg2: #161820;
    --bg3: #1e2130;
    --bg-hover: #252838;
    --border: #2a2e3d;
    --text: #c8ccd8;
    --text-dim: #5a5f72;
    --text-bright: #eef0f5;
    --accent: #7c6aff;
    --accent-dim: rgba(124,106,255,0.15);
    --red: #f87171;
    --green: #4ade80;
    --yellow: #fbbf24;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    user-select: none;
  }

  /* ════════════════════════════════════════
     TOP BAR — PC 스타일 (기본)
  ════════════════════════════════════════ */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 48px;
    padding: 0 16px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar .logo { font-weight: 600; font-size: 15px; color: var(--accent); letter-spacing: 0.5px; white-space: nowrap; }
  .topbar .spacer { flex: 1; }
  .topbar .fname {
    font-size: 12px; color: var(--text-dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* PC topbar 버튼 */
  .topbar button {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: all .15s;
    flex-shrink: 0;
  }
  .topbar button:hover { background: var(--bg-hover); border-color: var(--accent); color: var(--text-bright); }
  .topbar button.primary { background: #ffd9df; border-color: #ffd9df; color: #4c4143; }
  .topbar button.primary:hover { background: #ff8b9a; }
  .topbar button.open-btn { background: #c4c1ef; border-color: #c4c1ef; color: white; }
  .topbar button.open-btn:hover { background: #7c6aff; }
  .topbar button.reset-btn { background: #b3deeb; border-color: #b3deeb; color: white; }
  .topbar button.reset-btn:hover { background: #69a4b7; }
  .topbar button:disabled { opacity: .35; cursor: default; pointer-events: none; }

  /* 모바일 topbar 버튼 — .tb-btn (기본 숨김, 모바일에서만 표시) */
  .tb-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 13px;
    width: 30px; height: 30px;
    border-radius: 6px;
    cursor: pointer;
    display: none;
    align-items: center; justify-content: center;
    transition: all .15s;
    flex-shrink: 0;
  }
  .tb-btn:active { background: var(--bg-hover); border-color: var(--accent); }
  .tb-btn.primary { background: #ffd9df; border-color: #ffd9df; color: #4c4143; }
  .tb-btn.primary:active { background: #ff8b9a; }
  .tb-btn.open-btn { background: #c4c1ef; border-color: #c4c1ef; color: white; font-weight: 600; font-size: 11px; width: auto; padding: 0 10px; }
  .tb-btn.open-btn:active { background: #7c6aff; }
  .tb-btn:disabled { opacity: .35; pointer-events: none; }

  /* PC 전용 버튼 */
  .pc-only { display: flex; }
  /* 모바일 전용 버튼 */
  .mb-only { display: none !important; }

  /* theme toggle */
  .theme-toggle {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text);
    font-size: 16px; width: 32px; height: 32px; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all .15s;
    flex-shrink: 0;
  }
  .theme-toggle:hover { background: var(--bg-hover); border-color: var(--accent); }

  /* invis toggle */
  .invis-toggle-btn {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text-dim);
    font-size: 12px; font-family: var(--font-ui); font-weight: 600;
    padding: 0 8px; height: 30px;
    border-radius: 4px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    transition: all .15s; flex-shrink: 0;
    line-height: 1;
  }
  .invis-toggle-btn .eye-icon {
    display: block; line-height: 1; font-style: normal;
  }
  .invis-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
  .invis-toggle-btn.active { background: #fff0f0; border-color: #ff4757; color: #ff4757; }
  .invis-count {
    font-size: 8px; background: #ff4757; color: white;
    border-radius: 8px; padding: 0 4px; font-weight: 700;
  }

  /* ════════════════════════════════════════
     LAYOUT — PC (기본)
  ════════════════════════════════════════ */
  .layout {
    display: flex;
    overflow: hidden;
  }

  /* ─── PC SIDEBAR ─── */
  .sidebar {
    width: 380px; min-width: 380px;
    background: var(--bg2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-header {
    padding: 10px 14px; font-size: 10px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1.2px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
    flex-shrink: 0;
  }
  .sidebar-header .controls { display: flex; gap: 4px; align-items: center; margin-left: auto; }

  .sort-btn, .action-btn {
    cursor: pointer; color: var(--text-dim); font-size: 11px; padding: 3px 8px;
    border-radius: 4px; transition: all .15s; background: transparent;
    border: 1px solid transparent; font-family: var(--font-ui); font-weight: 600;
    white-space: nowrap;
  }
  .sort-btn:hover, .action-btn:hover { background: var(--bg3); border-color: var(--border); color: var(--text); }
  .sort-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .action-btn.toc-btn { background: #fff3bd; color: #2d3436; border-color: #ffda64; }
  .action-btn.toc-btn:hover { background: #ffeaa7; border-color: #f39c12; }
  .action-btn.search-btn { background: #c2f1d6; color: #2c2c2c; border-color: #83d5a6; }
  .action-btn.search-btn:hover { background: #7ae1a5; border-color: #7ae1a5; }

  .file-tree { flex: 1; overflow-y: auto; padding: 6px 0; -webkit-overflow-scrolling: touch; }
  .file-group-label {
    padding: 8px 14px 4px; font-size: 9px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
  }
  .file-group-label:hover { color: var(--text); }
  .file-group { margin-bottom: 4px; }
  .file-group.collapsed .file-group-items { display: none; }

  .file-item {
    display: flex; align-items: center; gap: 8px; padding: 5px 14px;
    font-size: 11px; color: var(--text); cursor: pointer; transition: background .12s;
    white-space: nowrap; overflow: hidden;
  }
  .file-item:hover { background: var(--bg-hover); }
  .file-item.active { background: var(--accent-dim); color: var(--accent); }
  .file-item .icon { font-size: 13px; width: 16px; text-align: center; flex-shrink: 0; }
  .file-item .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .file-item .timestamp { font-size: 9px; color: var(--text-dim); font-family: var(--font-code); flex-shrink: 0; }
  .file-item.active .timestamp { color: var(--accent); }
  .file-item.modified { color: var(--red); }
  .file-item .spine-num {
    font-size: 9px; background: var(--accent-dim); color: var(--accent);
    padding: 1px 4px; border-radius: 3px; margin-right: 4px;
  }

  /* ─── MAIN ─── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }

  /* ─── EDITOR TABS ─── */
  .editor-tabs {
    display: flex; align-items: center; gap: 2px; padding: 6px 10px 0;
    background: var(--bg); flex-shrink: 0; overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
  }
  .editor-tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 6px 12px; font-size: 11px; color: var(--text-dim);
    border-radius: 6px 6px 0 0; cursor: pointer; background: transparent; border: none;
    font-family: var(--font-ui); transition: all .12s; white-space: nowrap;
    max-width: 160px; overflow: hidden; text-overflow: ellipsis;
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .tab:hover { color: var(--text); background: var(--bg3); }
  .tab.active { background: var(--bg2); color: var(--text-bright); border: 1px solid var(--border); border-bottom: 1px solid var(--bg2); margin-bottom: -1px; }
  .tab.modified::before { content: "●"; color: var(--yellow); margin-right: 4px; }
  .tab .close { opacity: .4; cursor: pointer; font-size: 14px; }
  .tab .close:hover { opacity: 1; color: var(--red); }

  /* ─── EDITOR WRAP ─── */
  .editor-wrap { flex: 1; display: flex; flex-direction: column; border-top: 1px solid var(--border); overflow: hidden; background: var(--bg2); }

  /* ─── CODE EDITOR ─── */
  .editor-container {
    flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column;
  }
  .editor-inner {
    flex: 1; display: flex; overflow: hidden; position: relative;
  }
  .line-numbers {
    flex-shrink: 0;
    background: var(--bg3);
    border-right: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font-code);
    font-size: 10px;
    line-height: 1.7;
    padding: 16px 7px 16px 4px;
    text-align: right;
    overflow: hidden;
    user-select: none;
    white-space: pre;
    min-width: 38px;
    z-index: 1;
    pointer-events: none;
  }
  .line-numbers.txt-mode {
    font-size: 10px;
    line-height: 1.8;
  }
  .code-editor {
    flex: 1;
    background: var(--bg); color: var(--text);
    font-family: var(--font-code);
    font-size: 13px; line-height: 1.7;
    padding: 16px 20px;
    resize: none; border: none; outline: none;
    overflow: auto; tab-size: 2;
    position: relative; z-index: 2;
    white-space: pre;   /* 줄바꿈 방지 → 줄번호 정확도 보장 */
  }
  /* TXT 모드: 줄바꿈 허용 + 줄번호 숨김 (wrap되면 번호가 어긋나므로) */
  .code-editor.txt-mode {
    white-space: pre-wrap;
    word-break: break-word;
  }
  .line-numbers.txt-mode-hidden {
    display: none;
  }

  /* TXT 전용 contenteditable 에디터 */
  .txt-editor-wrap {
    flex: 1; display: flex; overflow: hidden;
  }
  .txt-line-numbers {
    flex-shrink: 0;
    background: var(--bg3);
    border-right: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font-code);
    font-size: 10px;
    line-height: 1;
    padding: 16px 7px 16px 4px;
    text-align: right;
    overflow: hidden;
    user-select: none;
    min-width: 38px;
    z-index: 1;
    pointer-events: none;
  }
  .txt-line-numbers span {
    display: block;
  }
  .txt-content-wrap {
    flex: 1; overflow: auto; position: relative;
  }
  .txt-editor {
    min-height: 100%;
    padding: 16px 20px;
    font-family: var(--font-code);
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
    outline: none;
    white-space: pre-wrap;
    word-break: break-word;
    tab-size: 2;
    caret-color: var(--text);
  }
  .code-editor::selection { background: rgba(124,106,255,0.25); }

  .invis-overlay {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    padding: 16px 20px;
    font-family: var(--font-code);
    font-size: 13px; line-height: 1.7;
    pointer-events: none; z-index: 3;
    overflow: hidden; white-space: pre-wrap; word-break: break-all;
    color: var(--text); tab-size: 2;
  }
  .invis-overlay.hidden { display: none; }

  .invis-badge {
    display: inline; background: #ff4757; color: #fff;
    font-size: 9px; font-family: var(--font-ui); font-weight: 700;
    border-radius: 3px; padding: 1px 3px; vertical-align: middle;
    pointer-events: none; line-height: 1; letter-spacing: 0;
  }
  .token-highlight {
    background: #ffb8b8; color: #650000;
    border-radius: 2px; outline: 2px solid #f52323; pointer-events: none;
  }

  /* ─── TOC ─── */
  .toc-editor { flex: 1; padding: 20px; overflow-y: auto; background: var(--bg); }
  .toc-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-radius: 6px; border: 1px solid transparent; transition: all .12s; cursor: grab; margin-bottom: 4px;
  }
  .toc-item:hover { border-color: var(--border); background: var(--bg3); }
  .toc-item.dragging { opacity: .4; }
  .toc-item .drag-handle { color: var(--text-dim); font-size: 14px; }
  .toc-item input.toc-label {
    flex: 1; background: transparent; border: none; color: var(--text-bright);
    font-family: var(--font-ui); font-size: 13px; outline: none;
  }
  .toc-item input.toc-label:focus { border-bottom: 1px solid var(--accent); }
  .toc-item .toc-target {
    font-size: 10px; color: var(--text-dim); font-family: var(--font-code);
    background: var(--bg2); padding: 2px 8px; border-radius: 4px;
    max-width: 140px; overflow: hidden; text-overflow: ellipsis;
  }
  .toc-item button { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; }
  .toc-item button:hover { background: var(--bg3); color: var(--red); }
  .toc-actions { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; flex-wrap: wrap; }
  .toc-actions button {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text);
    font-family: var(--font-ui); font-size: 11px; padding: 5px 12px; border-radius: 5px; cursor: pointer;
  }
  .toc-actions button:hover { border-color: var(--accent); color: var(--accent); }

  /* ─── IMAGE PREVIEW ─── */
  .img-preview-wrap {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg); gap: 16px; padding: 20px; overflow: auto;
  }
  .img-preview-wrap img { max-width: 100%; max-height: 60vh; border-radius: 8px; border: 1px solid var(--border); }
  .img-meta { font-size: 11px; color: var(--text-dim); font-family: var(--font-code); text-align: center; }
  .img-actions { display: flex; gap: 8px; }
  .img-actions button {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text);
    font-family: var(--font-ui); font-size: 11px; padding: 5px 12px; border-radius: 5px; cursor: pointer;
  }
  .img-actions button:hover { border-color: var(--accent); color: var(--accent); }
  .img-actions button.danger { background: #ffe5e5; color: #d32f2f; border-color: #ffcdd2; }
  .img-actions button.danger:hover { background: #ffcdd2; }

  /* ─── Empty state ─── */
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--text-dim); }
  .empty-state .big-icon { font-size: 48px; opacity: .3; }
  .empty-state p { font-size: 13px; text-align: center; }

  /* ─── STATUS BAR ─── */
  .statusbar {
    height: 28px; padding: 0 14px;
    background: var(--bg2); border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 20px;
    font-size: 10px; color: var(--text-dim); flex-shrink: 0;
    overflow: hidden;
  }
  .statusbar .modified { color: var(--yellow); }
  #statusFile { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ─── Drop overlay ─── */
  .drop-overlay {
    display: none; position: fixed; inset: 0; background: rgba(14,15,17,.85);
    z-index: 100; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
  }
  .drop-overlay.show { display: flex; }
  .drop-overlay .drop-box { border: 2px dashed var(--accent); border-radius: 16px; padding: 60px 80px; text-align: center; }
  .drop-overlay .drop-box p { font-size: 18px; color: var(--accent); font-weight: 500; }
  .drop-overlay .drop-box .sub { font-size: 12px; color: var(--text-dim); margin-top: 6px; }

  /* ─── MODAL (PC) ─── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg2); border-radius: 12px; border: 1px solid var(--border);
    width: 90%; max-width: 800px; max-height: 85vh; display: flex; flex-direction: column;
    box-shadow: 0 25px 50px rgba(0,0,0,0.25);
  }
  .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-header h3 { font-size: 15px; font-weight: 600; color: var(--text-bright); }
  .modal-header .close-btn { background: none; border: none; font-size: 20px; color: var(--text-dim); cursor: pointer; padding: 4px 8px; }
  .modal-header .close-btn:hover { color: var(--red); }
  .modal-body { flex: 1; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }
  .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
  .modal-footer button { padding: 8px 20px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--bg3); color: var(--text); }
  .modal-footer button:hover { border-color: var(--accent); }
  .modal-footer button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  .modal-footer button.primary:hover { opacity: 0.9; }

  /* ─── SEARCH MODAL ─── */
  .search-input-wrap { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
  .search-input-wrap input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 13px; outline: none; }
  .search-input-wrap input:focus { border-color: var(--accent); }
  .search-options { display: flex; gap: 16px; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
  .search-options label { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
  .filter-btns { display: flex; gap: 4px; align-items: center; }
  .filter-btn {
    padding: 3px 10px; font-size: 11px; font-weight: 600; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg3); color: var(--text-dim); font-family: var(--font-ui); transition: all .12s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .search-results { border: 1px solid var(--border); border-radius: 6px; max-height: 350px; overflow-y: auto; background: var(--bg); }
  .search-result-item { padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 12px; }
  .search-result-item:hover { background: var(--bg-hover); }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item .file-header { color: var(--accent); font-weight: 600; padding: 4px 0; }
  .search-result-item .line-info { color: var(--text-dim); }

  /* ─── TOC DIALOG ─── */
  .toc-section { margin-bottom: 20px; }
  .toc-section-header { font-size: 13px; font-weight: 600; color: var(--text-bright); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .toc-btn-row { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
  .toc-btn-row button { padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--bg3); color: var(--text); }
  .toc-btn-row button:hover { border-color: var(--accent); color: var(--accent); }
  .toc-btn-row button.success { background: #e8f5e9; color: #2e7d32; border-color: #81c784; }
  .toc-btn-row button.success:hover { background: #c8e6c9; }
  .toc-tree { border: 1px solid var(--border); border-radius: 6px; max-height: 200px; overflow-y: auto; background: var(--bg); margin-bottom: 15px; }
  .toc-tree-item { padding: 6px 12px; border-bottom: 1px solid var(--border); font-size: 12px; display: flex; align-items: center; gap: 8px; }
  .toc-tree-item:last-child { border-bottom: none; }
  .toc-tree-item.level-1 { background: #fff8dc; }
  .toc-tree-item.level-2 { background: #fffaf0; padding-left: 24px; }
  .toc-tree-item.level-3 { background: #ffffff; padding-left: 36px; }
  .new-toc-list { border: 1px solid var(--border); border-radius: 6px; max-height: 300px; overflow-y: auto; background: var(--bg); }
  .new-toc-item {
    padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12px;
    display: flex; align-items: center; gap: 8px; cursor: grab; transition: background .1s;
  }
  .new-toc-item:hover { background: var(--bg-hover); }
  .new-toc-item.selected { background: var(--accent-dim); }
  .new-toc-item.dragging { opacity: 0.5; }
  .new-toc-item:last-child { border-bottom: none; }
  .new-toc-item .label { flex: 1; }
  .new-toc-item .target { font-size: 10px; color: var(--text-dim); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .new-toc-item .level-badge { font-size: 9px; padding: 2px 6px; border-radius: 3px; background: var(--accent-dim); color: var(--accent); }
  .toc-edit-btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .toc-edit-btns button { padding: 5px 10px; font-size: 11px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg3); color: var(--text); cursor: pointer; }
  .toc-edit-btns button:hover { border-color: var(--accent); }
  .toc-edit-btns button.danger { background: #ffe5e5; color: #d32f2f; border-color: #ffcdd2; }
  .toc-edit-btns button.danger:hover { background: #ffcdd2; }

  /* ─── SCROLLBAR ─── */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

  /* ─── PC 전용: 컨텍스트 메뉴 ─── */
  .ctx-menu {
    display: none;
    position: fixed;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    z-index: 999;
    min-width: 140px;
    overflow: hidden;
  }
  .ctx-menu.show { display: block; }
  .ctx-menu-item {
    padding: 9px 14px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text);
    display: flex; align-items: center; gap: 8px;
    transition: background .1s;
  }
  .ctx-menu-item:hover { background: var(--bg-hover); }
  .ctx-menu-item.danger { color: var(--red); }
  .ctx-menu-item.danger:hover { background: #fff0f0; }
  .ctx-menu-sep { height: 1px; background: var(--border); margin: 3px 0; }

  /* ════════════════════════════════════════
     MOBILE OVERRIDES  (≤768px)
  ════════════════════════════════════════ */
  @media (max-width: 768px) {
    body { height: 100dvh; }

    /* topbar */
    .topbar { height: 42px; gap: 6px; padding: 0 10px; }
    .topbar .logo { font-size: 13px; letter-spacing: 0.3px; }
    .topbar .fname { font-size: 10px; flex: 1; min-width: 0; }
    .topbar .spacer { display: none; }

    /* PC 버튼 숨기고 tb-btn 보이기 */
    .pc-only { display: none !important; }
    .mb-only { display: flex !important; }
    .tb-btn { display: flex; }
    /* PC reset-btn은 모바일에서 숨김 */
    .reset-btn.pc-only { display: none !important; }

    /* theme-toggle 모바일에서 숨김 */
    .theme-toggle { display: none !important; }

    /* invis toggle */
    .invis-toggle-btn { padding: 0; width: 30px; height: 30px; font-size: 12px; }

    /* layout */
    .layout { flex-direction: column; height: calc(100dvh - 42px - 22px); }

    /* sidebar → 하단 드로어 */
    .sidebar {
      position: fixed;
      bottom: 22px; left: 0; right: 0;
      width: auto; min-width: unset;
      height: 50vh;
      border-right: none;
      border-top: 2px solid var(--accent);
      transform: translateY(100%);
      transition: transform .25s cubic-bezier(.4,0,.2,1);
      z-index: 50;
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.18);
    }
    .sidebar.open { transform: translateY(0); }

    /* 드로어 핸들 */
    .drawer-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 8px auto 0;
      flex-shrink: 0;
      display: block;
    }

    /* sidebar-header 모바일 */
    .sidebar-header { padding: 6px 12px; font-size: 9px; letter-spacing: 1.2px; }
    .sort-btn, .action-btn { font-size: 10px; padding: 3px 7px; }

    /* file-item 모바일 */
    .file-item { font-size: 12px; padding: 7px 12px; }
    .file-item .timestamp { font-size: 9px; }

    /* editor tabs 모바일 */
    .editor-tabs { padding: 4px 8px 0; }
    .tab { padding: 4px 10px; font-size: 10px; max-width: 130px; }

    /* code editor 모바일 */
    .code-editor { font-size: 12px; line-height: 1.65; padding: 10px 12px; }
    .invis-overlay { font-size: 12px; line-height: 1.65; padding: 10px 12px; }
    .line-numbers { font-size: 9px; line-height: 1.65; padding: 10px 6px 10px 4px; min-width: 32px; }
    .line-numbers.txt-mode { font-size: 9px; line-height: 1.75; }

    /* status bar 모바일 */
    .statusbar { height: 22px; padding: 0 10px; gap: 10px; font-size: 9px; }

    /* FAB 파일 트리 버튼 */
    .fab-files {
      position: fixed;
      bottom: calc(22px + 12px);
      left: 12px;
      width: 40px; height: 40px;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      border: none;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(90,79,212,0.4);
      z-index: 49;
      transition: all .2s;
    }
    .fab-files:active { transform: scale(0.92); }
    .fab-files.drawer-open { background: var(--red); }

    /* 드로어 딤 */
    .drawer-dim {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.3); z-index: 49;
    }
    .drawer-dim.show { display: block; }

    /* modal → bottom sheet */
    .modal-overlay { align-items: flex-end; justify-content: center; }
    .modal { border-radius: 14px 14px 0 0; width: 100%; max-height: 88vh; }
    .modal-header { padding: 12px 16px; }
    .modal-header h3 { font-size: 14px; }
    .modal-body { padding: 14px; }
    .modal-footer { padding: 12px 16px; gap: 8px; }
    .modal-footer button { padding: 8px 18px; font-size: 12px; }

    /* search input 모바일 */
    .search-input-wrap { gap: 8px; margin-bottom: 12px; }
    .search-input-wrap input { padding: 9px 12px; font-size: 13px; }
    .search-results { max-height: 280px; }

    /* toc 모바일 */
    .toc-tree { max-height: 160px; }
    .new-toc-list { max-height: 220px; }

    /* scrollbar 모바일 */
    ::-webkit-scrollbar { width: 4px; height: 4px; }

    /* 컨텍스트 메뉴 모바일에서 숨김 */
    .ctx-menu { display: none !important; }

    /* 이미지 미리보기 */
    .img-preview-wrap img { max-height: 55vh; }
    .img-meta { font-size: 10px; }

    /* drop overlay */
    .drop-overlay .drop-box { padding: 40px 50px; }
    .drop-overlay .drop-box p { font-size: 16px; }
  }
</style>
</head>

<!-- ─── Drop overlay ─── -->

<!-- ─── Search Modal ─── -->

        <button onclick="performSearch()" style="padding:10px 20px;background:var(--accent);color:white;border:none;border-radius:6px;cursor:pointer;">검색</button>

</div>

<!-- ─── TOC Modal ─── -->
<div class="modal-overlay" id="tocModal">
  <div class="modal" style="max-width:900px;">
    <div class="modal-header">
      <h3>📚 목차 편집</h3>
      <button class="close-btn" onclick="closeTocModal()">×</button>

        <button onclick="loadTocFromHtml()">📝 목차 찾기 (h1~h6)</button>

<!-- ─── PC 컨텍스트 메뉴 ─── -->
<div class="ctx-menu" id="ctxMenu">

</div>

<!-- ─── Top bar ─── -->
<div class="topbar">
  <div class="logo">👻 EP_Editor</div>
  <span class="fname" id="topFname">EPUB / TXT 미열람</span>
  <div class="spacer"></div>
  <button class="theme-toggle" id="btnTheme" title="테마 전환">🌙</button>

  <button class="invis-toggle-btn" id="invisToggleBtn" onclick="toggleInvisMode()" title="공백코드 토글"><i class="eye-icon">👀</i><span class="invis-count" id="invisCount" style="display:none">0</span>
  </button>
  <!-- PC 버튼 -->
  <button class="open-btn pc-only" id="btnOpenPc">Open</button>
  <button id="btnSavePc" class="primary pc-only" disabled>Save</button>
  <button id="btnResetPc" class="reset-btn pc-only" disabled>Reset</button>

<div class="layout">
  <!-- 파일 트리 (PC: sidebar / 모바일: 드로어) -->

    <!-- 드로어 핸들 (모바일에서만 보임) -->

      <div class="empty-state">
        <div class="big-icon">📖</div>
        <p id="emptyMsg">왼쪽 파일 트리에서 편집할 파일을 선택하세요</p>
      </div>

<!-- 드로어 딤 배경 (모바일) -->
<div class="drawer-dim" id="drawerDim" onclick="closeDrawer()"></div>

<!-- FAB (모바일) -->
<button class="fab-files" id="fabFiles" onclick="toggleDrawer()" style="display:none;">🗂</button>

<!-- ─── Status bar ─── -->
<div class="statusbar">
  <span id="statusFile">—</span>
  <span id="statusType">—</span>
  <span id="statusModified"></span>
  <div style="flex:1"></div>
  <span id="statusTimestamp">—</span>
  <span id="statusSize">—</span>
</div>

<script>
  // ════════════════════════════════════════
  //  MODE DETECTION
  // ════════════════════════════════════════
  let isMobile = false;

  function detectMode() {
    const prev = isMobile;
    isMobile = window.innerWidth <= 768;
    if(prev !== isMobile) applyMode();
  }

  function applyMode() {
    const handle = document.getElementById('drawerHandle');
    const fab = document.getElementById('fabFiles');
    const emptyMsg = document.getElementById('emptyMsg');

    if(isMobile) {
      handle.style.display = 'block';
      fab.style.display = 'flex';
      emptyMsg.textContent = '버튼을 눌러 EPUB을 열고\n좌하단 버튼으로 파일을 선택하세요';
      // PC 사이드바가 열려있으면 닫기
      closeSidebarIfOpen();
    } else {
      handle.style.display = 'none';
      fab.style.display = 'none';
      emptyMsg.textContent = '왼쪽 파일 트리에서 편집할 파일을 선택하세요';
      closeDrawer();
    }
  }

  window.addEventListener('resize', detectMode);

  // ════════════════════════════════════════
  //  STATE
  // ════════════════════════════════════════
  let zip = null;
  let files = {};
  let fileTypes = {};
  let fileTimestamps = {};
  let openTabs = [];
  let activeTab = null;
  let modifiedFiles = new Set();
  let tocEntries = [];
  let newTocEntries = [];
  let selectedNewTocIndex = -1;
  let tocFilePath = null;
  let opfPath = null;
  let spine = [];
  let sortMode = 'type';
  let currentFileName = '';
  let invisModeOn = false;

  // TXT 모드 전용
  let isTxtMode = false;
  let txtChapters = [];   // [{title, startLine, endLine}, ...]
  let txtContent  = '';   // 전체 원문

  // ─── 제로폭/불가시 문자 정의 ───
  const INVIS_CHARS = {
    '\u2060': 'WJ', '\u2061': 'FA', '\u2062': 'IT', '\u2063': 'IS', '\u2064': 'IP',
    '\uFEFF': 'BOM', '\u200B': 'ZW', '\u200C': 'ZWNJ', '\u200D': 'ZWJ',
    '\u00AD': 'SHY', '\u180E': 'MVS', '\u034F': 'CGJ',
  };
  const INVIS_REGEX = /[\u2060-\u2064\uFEFF\u200B-\u200D\u00AD\u180E\u034F]/g;
  const BOOK_TOKEN_REGEX = /(<meta\s[^>]*(?:name|content)\s*=\s*["'][^"']*book-token[^"']*["'][^>]*(?:\/>|>(?:.*?)<\/meta>))/gi;

  // ─── DOM ───
  const dropOverlay = document.getElementById('dropOverlay');
  const fileTree = document.getElementById('fileTree');
  const editorTabs = document.getElementById('editorTabs');
  const editorWrap = document.getElementById('editorWrap');
  const fileInput = document.getElementById('fileInput');
  const topFname = document.getElementById('topFname');
  const statusFile = document.getElementById('statusFile');
  const statusType = document.getElementById('statusType');
  const statusModified = document.getElementById('statusModified');
  const statusTimestamp = document.getElementById('statusTimestamp');
  const statusSize = document.getElementById('statusSize');

  // ─── BUTTON REFS ───
  const btnOpenPc  = document.getElementById('btnOpenPc');
  const btnSavePc  = document.getElementById('btnSavePc');
  const btnResetPc = document.getElementById('btnResetPc');
  const btnOpenMb  = document.getElementById('btnOpenMb');
  const btnSaveMb  = document.getElementById('btnSaveMb');
  const btnSearch  = document.getElementById('btnSearch');
  const btnToc     = document.getElementById('btnToc');

  function allSaveButtons()  { return [btnSavePc, btnSaveMb]; }
  function allOpenButtons()  { return [btnOpenPc, btnOpenMb]; }

  function setSaveDisabled(v) { allSaveButtons().forEach(b => b && (b.disabled = v)); }
  function setControlsDisabled(v) {
    if(btnResetPc) btnResetPc.disabled = v;
    btnSearch.disabled = v;
    btnToc.disabled = v;
  }

  // ─── DRAWER (모바일) ───
  const sidebar   = document.getElementById('sidebar');
  const drawerDim = document.getElementById('drawerDim');
  const fabFiles  = document.getElementById('fabFiles');

  function toggleDrawer() { sidebar.classList.contains('open') ? closeDrawer() : openDrawer(); }
  function openDrawer() {
    sidebar.classList.add('open');
    drawerDim.classList.add('show');
    fabFiles.classList.add('drawer-open');
    fabFiles.textContent = '✕';
  }
  function closeDrawer() {
    sidebar.classList.remove('open');
    drawerDim.classList.remove('show');
    fabFiles.classList.remove('drawer-open');
    fabFiles.textContent = '🗂';
  }
  function closeSidebarIfOpen() {
    if(sidebar.classList.contains('open')) closeDrawer();
  }

  // 드로어 핸들 스와이프 닫기
  document.getElementById('drawerHandle').addEventListener('touchstart', e => { window._touchY = e.touches[0].clientY; });
  document.getElementById('drawerHandle').addEventListener('touchend', e => {
    if(e.changedTouches[0].clientY - (window._touchY || 0) > 40) closeDrawer();
  });

  // ─── THEME ───
  document.getElementById('btnTheme').addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    const isDark = document.documentElement.classList.contains('dark');
    document.getElementById('btnTheme').textContent = isDark ? '🔆' : '🌙';
  });

  // ─── DRAG & DROP ───
  document.body.addEventListener('dragenter', e => { e.preventDefault(); e.stopPropagation(); dropOverlay.classList.add('show'); });
  document.body.addEventListener('dragleave', e => { e.preventDefault(); e.stopPropagation(); if(e.target === dropOverlay || e.target === document.body) dropOverlay.classList.remove('show'); });
  document.body.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); });
  document.body.addEventListener('drop', async e => {
    e.preventDefault(); e.stopPropagation();
    dropOverlay.classList.remove('show');
    if(e.dataTransfer?.files?.length > 0) {
      const file = [...e.dataTransfer.files].find(f => f.name.toLowerCase().endsWith('.epub') || f.name.toLowerCase().endsWith('.txt'));
      if(file) {
        if(file.name.toLowerCase().endsWith('.txt')) loadTxt(file);
        else loadEpub(file);
      }
      else alert('EPUB 또는 TXT 파일만 업로드 가능합니다');
    }
  });

  // ─── OPEN / RESET ───
  allOpenButtons().forEach(b => b.addEventListener('click', () => fileInput.click()));
  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    if(!f) return;
    if(f.name.toLowerCase().endsWith('.txt')) loadTxt(f);
    else loadEpub(f);

    topFname.textContent = 'EPUB / TXT 미열람';
