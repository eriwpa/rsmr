<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB(TXT) 순수 텍스트 비교 👻</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121119/diff_match_patch.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #fafaff;
            --surface: #ffffff;
            --border: #e9ecf5;
            --text: #3d4451;
            --text-soft: #8890a0;
            --pink: #ffb3d1;
            --purple: #d4c5f9;
            --teal: #ff86a1;
            --add-text: #1565c0;
            --remove-text: #0f8d66;
            --added-bg: #eef5fc;
            --removed-bg: #eefcf2;
            --hover: #f5f2fb;
            --highlight-bg: #f9ffac;
            --highlight-text: #1a1a1a;
            --reflow-bg: #f4effc;
            --reflow-text: #8a6fd1;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            height: 100dvh;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
        }

        .top-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.4rem 0.7rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .file-panels-row {
            display: flex;
            align-items: stretch;
            gap: 0.5rem;
        }

        .file-panels {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            min-width: 0;
        }

        .compare-btn-group {
            display: flex;
            flex-shrink: 0;
            border-radius: 7px;
            overflow: hidden;
            background: linear-gradient(90deg, var(--pink), var(--purple));
        }

        .compare-btn-group .btn {
            background: transparent;
            color: white;
            border-radius: 0;
            white-space: nowrap;
            padding: 0.32rem 1rem;
            font-size: 0.72rem;
        }

        .compare-btn-group .btn:not(:first-child) {
            border-left: 1px solid rgba(255, 255, 255, 0.4);
        }

        .compare-btn-group .btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.18);
        }

        .file-panel {
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 0.25rem 0.5rem;
            background: var(--surface);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .file-panel-title {
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text);
            flex-shrink: 0;
        }

        .file-panel-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 0;
        }

        .file-name {
            font-size: 0.7rem;
            color: var(--text-soft);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .upload-btn {
            flex-shrink: 0;
            padding: 0.22rem 0.6rem;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .upload-btn:hover {
            background: var(--hover);
            border-color: var(--purple);
        }

        input[type="file"] {
            display: none;
        }

        .action-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.32rem 0.75rem;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--pink), var(--purple));
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            filter: brightness(1.05);
        }

        .btn-toggle {
            background: var(--surface);
            border: 1.5px solid var(--border);
            color: var(--text);
        }

        .btn-toggle:hover {
            background: var(--hover);
        }

        .btn-toggle.active {
            background: var(--purple);
            border-color: var(--purple);
            color: white;
        }

        .view-mode-group {
            display: flex;
            gap: 0.3rem;
        }

        .btn-accent {
            background: var(--teal);
            color: white;
        }

        .btn-accent:hover:not(:disabled) {
            filter: brightness(1.05);
        }

        .diff-counter {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-soft);
            min-width: 3.5rem;
            text-align: center;
        }

        .content-row {
            flex: 1;
            overflow-y: auto;
            background: var(--surface);
        }

        .compare-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-bottom: 1px solid var(--border);
        }

        .compare-row.row-removed {
            background: var(--removed-bg);
        }

        .compare-row.row-added {
            background: var(--added-bg);
        }

        .compare-row.row-current {
            box-shadow: inset 4px 0 0 var(--teal);
        }

        .compare-row.row-reflow {
            background: var(--reflow-bg);
        }

        .reflow-marker {
            padding: 0.15rem 1.2rem;
            text-align: center;
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--reflow-text);
            background: var(--reflow-bg);
        }

        .collapsed-divider {
            padding: 0.15rem 1.2rem;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-soft);
            background: var(--hover);
            border-bottom: 1px solid var(--border);
        }

        .compare-cell {
            padding: 0.45rem 0.9rem;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            border-right: 1px solid var(--border);
        }

        .compare-cell:last-child {
            border-right: none;
        }

        .compare-cell.cell-watermark {
            background: #d4ffd1;
        }

        .placeholder-empty {
            color: var(--text-soft);
            font-style: italic;
            font-size: 0.85rem;
        }

        .text-unique-left {
            color: var(--remove-text);
            font-weight: 600;
        }

        .text-unique-right {
            color: var(--add-text);
            font-weight: 600;
        }

        .removed,
        .added {
            background: var(--highlight-bg);
            color: var(--highlight-text);
            font-weight: 700;
            padding: 1px 3px;
            border-radius: 3px;
        }

        .watermark-char {
            display: inline-block;
            background: #d90429;
            color: #fff;
            font-weight: 800;
            font-size: 0.7em;
            font-family: 'Consolas', 'Courier New', monospace;
            padding: 0 0.2em;
            margin: 0 1px;
            border-radius: 3px;
            box-shadow: 0 0 0 1px #ffccd2;
            cursor: help;
            letter-spacing: -0.5px;
        }

        .legend {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.9rem;
            font-size: 0.7rem;
            color: var(--text-soft);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .legend-swatch {
            width: 0.7rem;
            height: 0.7rem;
            border-radius: 3px;
            display: inline-block;
            flex-shrink: 0;
        }

        .swatch-removed { background: var(--remove-text); border: 1px solid var(--remove-text); }
        .swatch-added { background: var(--add-text); border: 1px solid var(--add-text); }
        .swatch-highlight { background: var(--highlight-bg); border: 1px solid var(--highlight-text); }
        .swatch-current { background: var(--teal); border: 1px solid var(--teal); }
        .swatch-watermark { background: #d4ffd1; border: 1px solid #4caf50; }
        .swatch-reflow { background: var(--reflow-bg); border: 1px solid var(--reflow-text); }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 3rem;
            text-align: center;
            color: var(--text-soft);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.4;
        }

        .empty-text {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .loading {
            position: fixed;
            inset: 0;
            background: rgba(250, 250, 255, 0.95);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-box {
            background: var(--surface);
            padding: 2rem 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--purple);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        .loading-text {
            font-size: 1rem;
            color: var(--text);
            font-weight: 500;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--purple);
        }

        @media (max-width: 720px) {
            .file-panels-row {
                flex-direction: column;
            }

            .file-panels {
                grid-template-columns: 1fr;
            }

            .compare-btn-group {
                width: 100%;
            }

            .compare-btn-group .btn {
                flex: 1;
            }

            .action-bar {
                justify-content: flex-start;
                gap: 0.3rem;
            }

            .action-bar .btn {
                padding: 0.2rem 0.55rem;
                font-size: 0.66rem;
            }

            .view-mode-group {
                flex-wrap: wrap;
                gap: 0.25rem;
            }

            .diff-counter {
                min-width: auto;
                font-size: 0.68rem;
            }

            .legend {
                justify-content: flex-start;
                font-size: 0.65rem;
            }

            .compare-row {
                grid-template-columns: 1fr;
            }

            .compare-cell {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .compare-cell:last-child {
                border-bottom: none;
            }

            .compare-cell::before {
                display: block;
                font-size: 0.65rem;
                font-weight: 700;
                color: var(--text-soft);
                margin-bottom: 0.2rem;
            }

            .compare-cell:first-child::before {
                content: '파일 A';
            }

            .compare-cell:last-child::before {
                content: '파일 B';
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="top-bar">
            <div class="file-panels-row">
                <div class="file-panels">
                    <div class="file-panel">
                        <div class="file-panel-title">파일 A</div>
                        <div class="file-panel-controls">
                            <button class="upload-btn" onclick="document.getElementById('file1').click()">파일 선택</button>
                            <span class="file-name" id="fileName1">선택된 파일 없음</span>
                        </div>
                    </div>
                    <div class="file-panel">
                        <div class="file-panel-title">파일 B</div>
                        <div class="file-panel-controls">
                            <button class="upload-btn" onclick="document.getElementById('file2').click()">파일 선택</button>
                            <span class="file-name" id="fileName2">선택된 파일 없음</span>
                        </div>
                    </div>
                    <input type="file" id="file1" accept=".epub,.txt" onchange="handleFile(1, this)">
                    <input type="file" id="file2" accept=".epub,.txt" onchange="handleFile(2, this)">
                </div>
                <div class="compare-btn-group">
                    <button class="btn" id="compareBtn" disabled onclick="compareFiles()">파일 비교 🫧</button>
                    <button class="btn" id="metaCompareBtn" disabled onclick="compareMeta()">메타 비교 👻</button>
                </div>
            </div>

            <div class="action-bar">
                <div class="view-mode-group">
                    <button class="btn btn-toggle active" id="viewFullBtn" onclick="applyViewMode('full')">전체 보기</button>
                    <button class="btn btn-toggle" id="viewSummaryBtn" onclick="applyViewMode('summary')">요약 보기</button>
                    <button class="btn btn-toggle" id="viewOnlyDiffBtn" onclick="applyViewMode('onlyDiff')">틀린곳만</button>
                </div>
                <button class="btn btn-accent" id="prevDiffBtn" disabled onclick="goToPrevMismatch()">◀ 이전</button>
                <span class="diff-counter" id="diffCounter">0/0</span>
                <button class="btn btn-accent" id="nextDiffBtn" disabled onclick="goToNextMismatch()">다음 ▶</button>
            </div>

            <div class="legend">
                <span class="legend-item"><span class="legend-swatch swatch-removed"></span>파일 A에만 존재</span>
                <span class="legend-item"><span class="legend-swatch swatch-added"></span>파일 B에만 존재</span>
                <span class="legend-item"><span class="legend-swatch swatch-highlight"></span>차이점</span>
                <span class="legend-item"><span class="legend-swatch swatch-current"></span>현재 위치</span>
                <span class="legend-item"><span class="legend-swatch swatch-watermark"></span>공백 코드</span>
                <span class="legend-item"><span class="legend-swatch swatch-reflow"></span>문단 재구성(내용 동일)</span>
            </div>
        </div>

        <div class="content-row">
            <div class="compare-body" id="compareBody">
                <div class="empty-state">
                    <div class="empty-icon">📄</div>
                    <div class="empty-text">두 개의 파일을 선택하고 비교하기를 눌러주세요 (epub / txt)</div>
                </div>
            </div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="loading-box">
            <div class="spinner"></div>
            <div class="loading-text">분석 중...</div>
        </div>
    </div>

    <script>
        let file1 = null, file2 = null;
        let name1 = '', name2 = '';

        let allRows = [];
        let mismatchIndices = [];
        let currentMismatchPointer = -1;
        let lastCurrentRowIdx = null;
        let currentViewMode = 'full';
        const viewHtmlCache = { full: '', summary: '', onlyDiff: '' };

        function handleFile(num, input) {
            const file = input.files[0];
            if (!file) return;

            document.getElementById(`fileName${num}`).textContent = file.name;

            if (num === 1) {
                file1 = file;
                name1 = file.name;
            } else {
                file2 = file;
                name2 = file.name;
            }

            document.getElementById('compareBtn').disabled = !(file1 && file2);
            document.getElementById('metaCompareBtn').disabled = !(file1 && file2);
        }

        // ---------- ZIP에서 텍스트 파일만 추출 (이미지/폰트 등 바이너리 제외) ----------

        async function extractTextFiles(file) {
            const zip = new JSZip();
            const contents = await zip.loadAsync(file);
            const result = {};
            const binaryExts = /\.(jpg|jpeg|png|gif|webp|svg|bmp|ttf|otf|woff2?|mp3|mp4)$/i;

            for (const [path, zipFile] of Object.entries(contents.files)) {
                if (zipFile.dir) continue;
                if (binaryExts.test(path)) continue;
                result[path] = await zipFile.async('text');
            }

            return result;
        }

        // ---------- spine/NCX 읽기 순서 파악 ----------

        function parseXml(str) {
            const doc = new DOMParser().parseFromString(str, 'application/xml');
            if (doc.querySelector('parsererror')) return null;
            return doc;
        }

        function resolveRelPath(baseDir, href) {
            href = (href || '').split('#')[0];
            if (!href) return null;
            const parts = baseDir ? baseDir.split('/').filter(Boolean) : [];
            href.split('/').forEach(part => {
                if (part === '' || part === '.') return;
                if (part === '..') parts.pop();
                else parts.push(part);
            });
            return parts.join('/');
        }

        // OPF manifest+spine 기준 읽기 순서 (가장 신뢰도 높음)
        function getSpineOrder(filesObj) {
            const containerXml = filesObj['META-INF/container.xml'];
            if (!containerXml) return null;
            const cdoc = parseXml(containerXml);
            if (!cdoc) return null;
            const rootfile = cdoc.querySelector('rootfile');
            const opfPath = rootfile ? rootfile.getAttribute('full-path') : null;
            if (!opfPath || !(opfPath in filesObj)) return null;

            const opfDoc = parseXml(filesObj[opfPath]);
            if (!opfDoc) return null;
            const opfDir = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/')) : '';

            const manifest = {};
            opfDoc.querySelectorAll('manifest item').forEach(item => {
                manifest[item.getAttribute('id')] = item.getAttribute('href');
            });

            const order = [];
            const seen = new Set();
            opfDoc.querySelectorAll('spine itemref').forEach(itemref => {
                const href = manifest[itemref.getAttribute('idref')];
                if (!href) return;
                const resolved = resolveRelPath(opfDir, href);
                if (resolved && (resolved in filesObj) && !seen.has(resolved)) {
                    seen.add(resolved);
                    order.push(resolved);
                }
            });
            return order.length ? order : null;
        }

        // toc.ncx navMap 기준 읽기 순서 (spine 파악 실패 시 대체)
        function getNcxOrder(filesObj) {
            const ncxPath = Object.keys(filesObj).find(p => p.toLowerCase().endsWith('.ncx'));
            if (!ncxPath) return null;
            const doc = parseXml(filesObj[ncxPath]);
            if (!doc) return null;
            const ncxDir = ncxPath.includes('/') ? ncxPath.slice(0, ncxPath.lastIndexOf('/')) : '';

            const order = [];
            const seen = new Set();
            doc.querySelectorAll('navMap navPoint content').forEach(content => {
                const resolved = resolveRelPath(ncxDir, content.getAttribute('src'));
                if (resolved && (resolved in filesObj) && !seen.has(resolved)) {
                    seen.add(resolved);
                    order.push(resolved);
                }
            });
            return order.length ? order : null;
        }

        const HTML_RE = /\.(x?html?|htm)$/i;

        function getHtmlReadingOrder(filesObj) {
            const allHtml = Object.keys(filesObj).filter(p => HTML_RE.test(p));
            let order = (getSpineOrder(filesObj) || getNcxOrder(filesObj) || []).filter(p => HTML_RE.test(p));

            // spine/ncx에 안 걸린 나머지 html은 경로순으로 뒤에 붙여서 누락 방지
            const used = new Set(order);
            const orphans = allHtml.filter(p => !used.has(p)).sort((a, b) => a.localeCompare(b));
            return order.concat(orphans);
        }

        // ---------- 본문을 문단 배열로 추출 (태그/스크립트/스타일 제거) ----------

        const BLOCK_TAGS = new Set(['P','DIV','LI','H1','H2','H3','H4','H5','H6','TR','BLOCKQUOTE','SECTION','ARTICLE','TABLE','UL','OL','HR','PRE','FIGURE','FIGCAPTION','HEADER','FOOTER','ASIDE']);

        // epub 본문은 XHTML(XML)이라 <title/>처럼 자기닫힘 태그가 유효하다. 그런데
        // 'text/html' 모드로 파싱하면 <title>은 RCDATA라 자기닫힘을 인식하지 못하고
        // 이후 </title>가 나올 때까지 본문 전체(모든 <p>...)를 title 안으로 삼켜버려서
        // 본문이 통째로 사라지는 문제가 생긴다(Sigil 등 도구 버전에 따라 흔히 발생).
        // 그래서 먼저 XML로 파싱을 시도하고, 정말로 깨진 마크업일 때만 HTML 모드로 대체한다.
        function parseEpubDoc(htmlString) {
            const xmlDoc = new DOMParser().parseFromString(htmlString, 'application/xhtml+xml');
            if (xmlDoc && !xmlDoc.querySelector('parsererror')) return xmlDoc;
            return new DOMParser().parseFromString(htmlString, 'text/html');
        }

        function extractParagraphsFromHtml(htmlString) {
            const doc = parseEpubDoc(htmlString);
            const root = doc.body || doc.documentElement;
            const paragraphs = [];
            let current = '';

            function flush() {
                const norm = current.replace(/\s+/g, ' ').trim();
                if (norm) paragraphs.push(norm);
                current = '';
            }

            function walk(node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    current += node.nodeValue;
                    return;
                }
                if (node.nodeType !== Node.ELEMENT_NODE) return;
                // XML 모드에서는 tagName이 소스에 쓰인 대소문자를 그대로 보존하므로
                // (HTML 모드처럼 자동 대문자화되지 않음) 비교 전에 통일한다.
                const tag = node.tagName.toUpperCase();
                if (tag === 'SCRIPT' || tag === 'STYLE') return;
                if (tag === 'BR') { flush(); return; }
                if (tag === 'IMG') {
                    const alt = node.getAttribute('alt');
                    if (alt) current += `[이미지:${alt}]`;
                    return;
                }
                const isBlock = BLOCK_TAGS.has(tag);
                if (isBlock) flush();
                for (const child of node.childNodes) walk(child);
                if (isBlock) flush();
            }

            walk(root);
            flush();
            return paragraphs;
        }

        function buildBookParagraphs(filesObj, order) {
            const paragraphs = [];
            for (const p of order) {
                paragraphs.push(...extractParagraphsFromHtml(filesObj[p]));
            }
            return paragraphs;
        }

        async function extractParagraphsFromTxt(file) {
            const text = await file.text();
            return text
                .split(/\r?\n\s*\r?\n+/)
                .map(seg => seg.replace(/\s+/g, ' ').trim())
                .filter(Boolean);
        }

        async function getParagraphs(file) {
            if (/\.epub$/i.test(file.name)) {
                const filesObj = await extractTextFiles(file);
                const order = getHtmlReadingOrder(filesObj);
                if (order.length === 0) {
                    throw new Error(`${file.name}: 본문 html/xhtml 문서를 찾지 못했습니다.`);
                }
                return buildBookParagraphs(filesObj, order);
            }
            return extractParagraphsFromTxt(file);
        }

        // ---------- 문단 단위 정렬(Myers) diff ----------
        // 문단을 원자 단위로 취급해 최장 공통 부분열(LCS)을 찾는다.
        // diff_match_patch의 라인 모드(diff_linesToChars_)는 편집 횟수만 최소화할 뿐이라
        // 뒤쪽 공통 문단이 앞쪽 변경 블록에 잘못 흡수되는 경우가 있어 직접 구현한다.

        // 정렬(LCS) 판단은 워터마크 문자를 제거한 텍스트끼리 비교하고, 실제 화면에는
        // 각자의 원본(워터마크 포함) 텍스트를 그대로 돌려준다. 그래야 같은 책의 서로 다른
        // 배포본(워터마크만 다른 사본)을 비교할 때 문단이 통째로 "없음" 처리되지 않는다.
        function myersDiff(a, b, keyFn) {
            const key = keyFn || (x => x);
            const keysA = a.map(key);
            const keysB = b.map(key);
            const N = a.length, M = b.length;
            const MAX = N + M || 1;
            const offset = MAX;
            const v = new Int32Array(2 * MAX + 1);
            const trace = [];

            for (let d = 0; d <= MAX; d++) {
                trace.push(v.slice());
                for (let k = -d; k <= d; k += 2) {
                    let x;
                    if (k === -d || (k !== d && v[k - 1 + offset] < v[k + 1 + offset])) {
                        x = v[k + 1 + offset];
                    } else {
                        x = v[k - 1 + offset] + 1;
                    }
                    let y = x - k;
                    while (x < N && y < M && keysA[x] === keysB[y]) { x++; y++; }
                    v[k + offset] = x;
                    if (x >= N && y >= M) return myersBacktrack(trace, a, b, offset);
                }
            }
            return myersBacktrack(trace, a, b, offset);
        }

        function myersBacktrack(trace, a, b, offset) {
            let x = a.length, y = b.length;
            const ops = [];

            for (let d = trace.length - 1; d >= 0; d--) {
                const v = trace[d];
                const k = x - y;
                const prevK = (k === -d || (k !== d && v[k - 1 + offset] < v[k + 1 + offset])) ? k + 1 : k - 1;
                const prevX = v[prevK + offset];
                const prevY = prevX - prevK;

                while (x > prevX && y > prevY) {
                    ops.push({ op: 0, textA: a[x - 1], textB: b[y - 1] });
                    x--; y--;
                }
                if (d > 0) {
                    if (x === prevX) {
                        ops.push({ op: 1, textB: b[y - 1] });
                        y--;
                    } else {
                        ops.push({ op: -1, textA: a[x - 1] });
                        x--;
                    }
                }
            }
            return ops.reverse();
        }

        // 워터마크/공백 차이만 제외하고 이어붙인 본문이 완전히 같은지 비교하기 위한 정규화.
        function joinNormalized(lines) {
            return lines.map(stripWatermarkChars).join(' ').replace(/\s+/g, ' ').trim();
        }

        // 삭제/추가가 뒤섞인 구간(hunk)은 문단 개수가 달라질 수 있다(병합/분리/문장 이동).
        // 문단을 1:1로 억지로 짝지으면 실제로는 같은 내용인데 위치만 바뀐 부분이 "없음"으로
        // 잘못 표시된다. 그래서 문단 경계로 나누지 않고 hunk 전체를 한 덩어리의 텍스트로
        // 이어붙여 문자 단위로 비교한다 - 문단이 어떻게 재배치됐든 diff_match_patch가
        // 공통 부분을 알아서 정렬해 실제로 달라진 글자만 잡아낸다.
        function buildParagraphDiff(paragraphsA, paragraphsB) {
            const ops = myersDiff(paragraphsA, paragraphsB, stripWatermarkChars);
            const rows = [];
            let i = 0;

            while (i < ops.length) {
                if (ops[i].op === 0) {
                    rows.push({ type: 'match', left: ops[i].textA, right: ops[i].textB });
                    i++;
                    continue;
                }

                const delLines = [], insLines = [];
                while (i < ops.length && ops[i].op !== 0) {
                    if (ops[i].op === -1) delLines.push(ops[i].textA);
                    else insLines.push(ops[i].textB);
                    i++;
                }

                if (delLines.length === 0) {
                    for (const line of insLines) rows.push({ type: 'added', left: null, right: line });
                } else if (insLines.length === 0) {
                    for (const line of delLines) rows.push({ type: 'removed', left: line, right: null });
                } else {
                    const isReflow = joinNormalized(delLines) === joinNormalized(insLines);
                    rows.push({ type: 'block', leftLines: delLines, rightLines: insLines, isReflow });
                }
            }
            return rows;
        }

        function renderChangedPair(leftText, rightText) {
            const dmp = new diff_match_patch();
            const diffs = dmp.diff_main(leftText, rightText);
            dmp.diff_cleanupSemantic(diffs);

            let left = '', right = '';
            for (const [op, text] of diffs) {
                const esc = renderTextWithWatermarks(text);
                if (op === 0) { left += esc; right += esc; }
                else if (op === -1) { left += `<span class="removed">${esc}</span>`; }
                else if (op === 1) { right += `<span class="added">${esc}</span>`; }
            }
            return { left, right };
        }

        function containsWatermark(text) {
            if (!text) return false;
            for (const ch of text) {
                if (WATERMARK_CHARS[ch.codePointAt(0)]) return true;
            }
            return false;
        }

        function buildRowHtml(row, idx) {
            if (row.type === 'block' && row.isReflow) {
                const leftHtml = row.leftLines.map(renderTextWithWatermarks).join('<br><br>');
                const rightHtml = row.rightLines.map(renderTextWithWatermarks).join('<br><br>');
                const leftCellClass = row.leftLines.some(containsWatermark) ? ' cell-watermark' : '';
                const rightCellClass = row.rightLines.some(containsWatermark) ? ' cell-watermark' : '';

                return `<div class="reflow-marker">◆ 문단 병합/분리됨 (내용 동일)</div>
            <div class="compare-row row-reflow" id="row-${idx}">
                <div class="compare-cell${leftCellClass}">${leftHtml}</div>
                <div class="compare-cell${rightCellClass}">${rightHtml}</div>
            </div>`;
            }

            let leftHtml, rightHtml, rowClass, leftRaw, rightRaw;

            if (row.type === 'match') {
                leftHtml = renderTextWithWatermarks(row.left);
                rightHtml = renderTextWithWatermarks(row.right);
                rowClass = 'row-match';
                leftRaw = row.left;
                rightRaw = row.right;
            } else if (row.type === 'block') {
                leftRaw = row.leftLines.join('\n\n');
                rightRaw = row.rightLines.join('\n\n');
                const rendered = renderChangedPair(leftRaw, rightRaw);
                leftHtml = rendered.left;
                rightHtml = rendered.right;
                rowClass = 'row-changed';
            } else if (row.type === 'removed') {
                leftHtml = `<span class="text-unique-left">${renderTextWithWatermarks(row.left)}</span>`;
                rightHtml = `<span class="placeholder-empty">(파일 B에 없음)</span>`;
                rowClass = 'row-removed';
                leftRaw = row.left;
            } else {
                leftHtml = `<span class="placeholder-empty">(파일 A에 없음)</span>`;
                rightHtml = `<span class="text-unique-right">${renderTextWithWatermarks(row.right)}</span>`;
                rowClass = 'row-added';
                rightRaw = row.right;
            }

            const leftCellClass = containsWatermark(leftRaw) ? ' cell-watermark' : '';
            const rightCellClass = containsWatermark(rightRaw) ? ' cell-watermark' : '';

            return `<div class="compare-row ${rowClass}" id="row-${idx}">
                <div class="compare-cell${leftCellClass}">${leftHtml}</div>
                <div class="compare-cell${rightCellClass}">${rightHtml}</div>
            </div>`;
        }

        const SUMMARY_CONTEXT_LINES = 3;

        function computeVisibility(length, mismatchIdx, context) {
            const visible = new Array(length).fill(false);
            for (const idx of mismatchIdx) {
                for (let j = Math.max(0, idx - context); j <= Math.min(length - 1, idx + context); j++) {
                    visible[j] = true;
                }
            }
            return visible;
        }

        function buildContextHtml(rows, mismatchIdx, context) {
            const visible = computeVisibility(rows.length, mismatchIdx, context);
            let html = '';
            let i = 0;
            while (i < rows.length) {
                if (visible[i]) {
                    html += buildRowHtml(rows[i], i);
                    i++;
                    continue;
                }
                let j = i;
                while (j < rows.length && !visible[j]) j++;
                html += `<div class="collapsed-divider">── 동일한 문단 ${j - i}개 생략 ──</div>`;
                i = j;
            }
            return html;
        }

        function renderRows(rows) {
            allRows = rows;
            mismatchIndices = [];
            currentMismatchPointer = -1;
            lastCurrentRowIdx = null;

            rows.forEach((row, idx) => {
                if (row.type === 'match') return;
                if (row.type === 'block' && row.isReflow) return;
                mismatchIndices.push(idx);
            });

            const emptyHtml = `<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-text">두 파일의 문단 내용이 동일합니다</div></div>`;

            viewHtmlCache.full = rows.map((row, idx) => buildRowHtml(row, idx)).join('') || emptyHtml;
            viewHtmlCache.summary = buildContextHtml(rows, mismatchIndices, SUMMARY_CONTEXT_LINES) || emptyHtml;
            viewHtmlCache.onlyDiff = buildContextHtml(rows, mismatchIndices, 0) || emptyHtml;

            applyViewMode('full');
        }

        function applyViewMode(mode) {
            currentViewMode = mode;
            document.getElementById('compareBody').innerHTML = viewHtmlCache[mode] || '';

            document.getElementById('viewFullBtn').classList.toggle('active', mode === 'full');
            document.getElementById('viewSummaryBtn').classList.toggle('active', mode === 'summary');
            document.getElementById('viewOnlyDiffBtn').classList.toggle('active', mode === 'onlyDiff');

            if (lastCurrentRowIdx !== null) {
                const el = document.getElementById(`row-${lastCurrentRowIdx}`);
                if (el) el.classList.add('row-current');
            }

            updateDiffNavUI();
        }

        function updateDiffNavUI() {
            const total = mismatchIndices.length;
            const cur = currentMismatchPointer >= 0 ? currentMismatchPointer + 1 : 0;
            document.getElementById('diffCounter').textContent = `${cur}/${total}`;
            document.getElementById('prevDiffBtn').disabled = total === 0;
            document.getElementById('nextDiffBtn').disabled = total === 0;
        }

        function goToMismatch(rowIdx) {
            if (lastCurrentRowIdx !== null) {
                const prevEl = document.getElementById(`row-${lastCurrentRowIdx}`);
                if (prevEl) prevEl.classList.remove('row-current');
            }

            const el = document.getElementById(`row-${rowIdx}`);
            if (el) {
                el.classList.add('row-current');
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            lastCurrentRowIdx = rowIdx;
            updateDiffNavUI();
        }

        function goToNextMismatch() {
            if (!mismatchIndices.length) return;
            currentMismatchPointer = (currentMismatchPointer + 1) % mismatchIndices.length;
            goToMismatch(mismatchIndices[currentMismatchPointer]);
        }

        function goToPrevMismatch() {
            if (!mismatchIndices.length) return;
            currentMismatchPointer = (currentMismatchPointer - 1 + mismatchIndices.length) % mismatchIndices.length;
            goToMismatch(mismatchIndices[currentMismatchPointer]);
        }

        // 눈에 보이지 않는 워터마크(ID 은닉용) 문자를 어떤 문단 상태(동일/변경/단독)에서든
        // 항상 눈에 띄는 표식으로 바꿔서 보여준다. 두 문자가 이진 인코딩(0/1)처럼 섞여
        // 쓰이는 경우가 많아, 뭉뚱그린 기호 하나가 아니라 종류를 구분할 수 있는
        // [WJ]/[IS] 태그로 실제 코드 순서를 그대로 읽을 수 있게 표시한다.
        const WATERMARK_CHARS = {
            0x2060: { tag: 'WJ', title: 'U+2060 Word Joiner (워터마크 의심 문자)' },
            0x2063: { tag: 'IS', title: 'U+2063 Invisible Separator (워터마크 의심 문자)' }
        };

        function renderTextWithWatermarks(text) {
            let result = '';
            for (const ch of text) {
                if (ch === '&') { result += '&amp;'; continue; }
                if (ch === '<') { result += '&lt;'; continue; }
                if (ch === '>') { result += '&gt;'; continue; }

                const info = WATERMARK_CHARS[ch.codePointAt(0)];
                if (info) {
                    result += `<span class="watermark-char" title="${info.title}">[${info.tag}]</span>`;
                } else {
                    result += ch;
                }
            }
            return result;
        }

        function stripWatermarkChars(text) {
            let out = '';
            for (const ch of text) {
                if (!WATERMARK_CHARS[ch.codePointAt(0)]) out += ch;
            }
            return out;
        }

        async function compareFiles() {
            if (!file1 || !file2) return;
            document.getElementById('loading').style.display = 'flex';

            try {
                const paragraphsA = await getParagraphs(file1);
                const paragraphsB = await getParagraphs(file2);

                if (paragraphsA.length === 0 || paragraphsB.length === 0) {
                    throw new Error('본문 문단을 찾지 못했습니다.');
                }

                const rows = buildParagraphDiff(paragraphsA, paragraphsB);
                renderRows(rows);
            } catch (error) {
                alert('오류: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // ---------- OPF(패키지 메타데이터)만 비교 ----------

        async function getOpfInfo(file) {
            if (!/\.epub$/i.test(file.name)) {
                throw new Error(`${file.name}: OPF 메타데이터는 epub 파일에서만 추출할 수 있습니다.`);
            }
            const filesObj = await extractTextFiles(file);
            const containerXml = filesObj['META-INF/container.xml'];
            if (!containerXml) throw new Error(`${file.name}: META-INF/container.xml을 찾지 못했습니다.`);

            const cdoc = parseXml(containerXml);
            const rootfile = cdoc && cdoc.querySelector('rootfile');
            const opfPath = rootfile ? rootfile.getAttribute('full-path') : null;
            if (!opfPath || !(opfPath in filesObj)) {
                throw new Error(`${file.name}: OPF 파일 경로를 찾지 못했습니다.`);
            }

            return { path: opfPath, lines: filesObj[opfPath].split(/\r\n|\r|\n/) };
        }

        async function compareMeta() {
            if (!file1 || !file2) return;
            document.getElementById('loading').style.display = 'flex';

            try {
                const [opfA, opfB] = await Promise.all([getOpfInfo(file1), getOpfInfo(file2)]);
                const rows = buildParagraphDiff(opfA.lines, opfB.lines);
                renderRows(rows);
            } catch (error) {
                alert('오류: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
    </script>
</body>
</html>
