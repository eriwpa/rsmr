<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEXT TO EPUB 👻</title>
<style>
:root {
  --bg: #f3f4f6; --panel: #ffffff; --text: #1f2328; --muted: #6b7280; --line: #d6d9de;
  --btn: #eef0f3; --btn-h: #e2e5ea; --accent: #2563eb; --accent-h: #1d4ed8;
  --blue: #1e66d0; --green: #198754; --gray: #808080; --orange: #d97706; --red: #d1242f; --dgray: #555;
  --flash: #7f7f7f; --drop: #e8f0fe;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17191c; --panel: #212328; --text: #e6e7ea; --muted: #9aa0a8; --line: #3a3e45;
    --btn: #2c2f35; --btn-h: #363a41; --accent: #3b82f6; --accent-h: #2563eb;
    --blue: #6ea8fe; --green: #4ade80; --gray: #9aa0a8; --orange: #fbbf24; --red: #f87171; --dgray: #b0b4ba;
    --flash: #a0a0a0; --drop: #1e2a3d;
  }
}
:root[data-theme="dark"] {
  --bg: #17191c; --panel: #212328; --text: #e6e7ea; --muted: #9aa0a8; --line: #3a3e45;
  --btn: #2c2f35; --btn-h: #363a41; --accent: #3b82f6; --accent-h: #2563eb;
  --blue: #6ea8fe; --green: #4ade80; --gray: #9aa0a8; --orange: #fbbf24; --red: #f87171; --dgray: #b0b4ba;
  --flash: #a0a0a0; --drop: #1e2a3d;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 14px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; padding: 16px; }
.wrap { max-width: 860px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
h1 { font-size: 17px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
h1 small { color: var(--muted); font-weight: normal; font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.row label.k { width: 40px; flex: none; font-weight: bold; }
.path { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.path.on { color: var(--text); }
button { font: inherit; padding: 5px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--btn); color: var(--text); cursor: pointer; white-space: nowrap; }
button:hover { background: var(--btn-h); }
button:disabled { opacity: .5; cursor: default; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); vertical-align: -1px; margin-left: 4px; }
.main { display: flex; gap: 10px; }
.preview { flex: 1; min-width: 0; height: 430px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--bg); }
.preview p { margin: 0 0 4px; word-break: break-all; }
.preview hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
.preview .sm { font-size: 12px; }
.cover { width: 220px; flex: none; height: 430px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; text-align: center; overflow: hidden; }
.cover img { max-width: 100%; max-height: 100%; display: block; }
.drop .preview, .drop .cover { background: var(--drop); outline: 2px dashed var(--accent); }
.go { display: flex; justify-content: center; margin-top: 12px; }
.go button { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: bold; padding: 9px 40px; font-size: 15px; }
.go button:hover { background: var(--accent-h); }
.c-blue { color: var(--blue); } .c-green { color: var(--green); } .c-gray { color: var(--gray); }
.c-orange { color: var(--orange); } .c-red { color: var(--red); } .c-dgray { color: var(--dgray); }
dialog { border: 1px solid var(--line); border-radius: 10px; padding: 16px; background: var(--panel); color: var(--text); max-width: calc(100vw - 32px); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog h2 { font-size: 15px; margin: 0 0 12px; text-align: center; }
.radios { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; margin-bottom: 14px; }
.radios label { cursor: pointer; white-space: nowrap; }
.btns { display: flex; gap: 8px; justify-content: center; }
.btns button { flex: 1; }
#exList { width: 480px; max-width: 100%; height: 330px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 6px; margin: 8px 0 12px; font-size: 13px; }
#exList label { display: block; cursor: pointer; padding: 1px 0; word-break: break-all; }
#exList label.h2 { font-weight: bold; }
#exList label.h3 { padding-left: 22px; color: var(--dgray); font-size: 12px; }
.hint { text-align: center; color: var(--muted); font-size: 12px; margin: -6px 0 10px; }
.busy { cursor: progress; }
@media (max-width: 640px) {
  body { padding: 8px; }
  .wrap { padding: 12px; }
  .main { flex-direction: column; }
  .cover { width: 100%; height: 240px; }
  .preview { height: 340px; }
}
</style>

  <h2>제외할 목차를 선택하세요</h2>

  <div class="btns"><button id="exAll">✅ 모두 선택</button><button id="exNone">❎ 선택 해제</button></div>
  <div id="exList"></div>
  <div class="btns"><button id="exApply">⭕ 적용</button><button id="exReset">🔄 초기화</button><button id="exClose">❌ 닫기</button></div>
</dialog>

<script>
"use strict";
// ============================================================================
// 설정
// ============================================================================
// 표지 찾기 서버 주소. 비워 두면 이 페이지와 같은 서버(location.origin)를 쓴다.
const API = "https://txt2epub-proxy.eriwpa.workers.dev";

// ============================================================================
// Python 문자열 / 정규식 동작 (Rust text.rs 이식)
// ============================================================================
const PY_W = "\\p{L}\\p{N}_";
const PY_S = "\\s\\x1c-\\x1f";
const RS_W = "\\p{Alpha}\\p{M}\\p{Nd}\\p{Pc}\\p{Join_Control}";

/** Python(또는 Rust regex) 문법의 \s \w \d \b 를 JS 유니코드 정규식으로 바꿔 컴파일 */
function pyRe(pat, ignoreCase = false, rust = false) {
  const W = rust ? RS_W : PY_W;
  const S = rust ? "\\s" : PY_S;
  let out = "", inClass = false;
  for (let i = 0; i < pat.length; i++) {
    const c = pat[i];
    if (c === "\\") {
      const n = pat[++i];
      if (n === undefined) { out += "\\\\"; break; }
      if (n === "s") out += inClass ? S : `[${S}]`;
      else if (n === "w") out += inClass ? W : `[${W}]`;
      else if (n === "d") out += "\\p{Nd}";
      else if (n === "b" && !inClass) out += `(?:(?<=[${W}])(?![${W}])|(?<![${W}])(?=[${W}]))`;
      else out += "\\" + n;
      continue;
    }
    if (c === "[" && !inClass) {
      inClass = true; out += "[";
      if (pat[i + 1] === "^") { out += "^"; i++; }
      continue;
    }
    if (c === "]" && inClass) { inClass = false; out += "]"; continue; }
    out += c;
  }
  return new RegExp(out, "u" + (ignoreCase ? "i" : ""));
}
const gRe = (re) => new RegExp(re.source, re.flags + "g");
const reEscape = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

const PY_SPACE = /[\s\x1c-\x1f]/u;
function pyStrip(s) {
  let a = 0, b = s.length;
  while (a < b && PY_SPACE.test(s[a])) a++;
  while (b > a && PY_SPACE.test(s[b - 1])) b--;
  return s.slice(a, b);
}
function pyRstrip(s) {
  let b = s.length;
  while (b > 0 && PY_SPACE.test(s[b - 1])) b--;
  return s.slice(0, b);
}
/** str.splitlines() */
function pySplitlines(s) {
  if (!s) return [];
  const parts = s.split(/\r\n|[\n\r\x0b\x0c\x1c\x1d\x1e\x85\u2028\u2029]/);
  if (parts[parts.length - 1] === "") parts.pop();
  return parts;
}
const pad4 = (n) => String(n).padStart(4, "0");

// ============================================================================
// 파일명 / TXT 읽기
// ============================================================================
function splitext(name) {
  const dot = name.lastIndexOf(".");
  if (dot > 0 && /[^.]/.test(name.slice(0, dot))) return [name.slice(0, dot), name.slice(dot)];
  return [name, ""];
}

/** 윈도우 금지문자를 전각으로 + 공백 정리 */
function sanitizeFilename(name) {
  const MAP = { "/": "／", "\\": "＼", "?": "？", "!": "！", "|": "｜", ":": "：", "*": "＊", '"': "＂", "<": "〈", ">": "〉" };
  const mapped = [...name].map((c) => MAP[c] || c).join("");
  return pyStrip(mapped.replace(gRe(pyRe("\\s+")), " "));
}

/** utf-8(BOM) → utf-16(BOM 있을 때만) → cp949 순서 */
function decodeText(buf) {
  const u8 = new Uint8Array(buf);
  const dec = (enc, data) => { try { return new TextDecoder(enc, { fatal: true, ignoreBOM: true }).decode(data); } catch { return null; } };
  let t = null;
  if (u8[0] === 0xef && u8[1] === 0xbb && u8[2] === 0xbf) t = dec("utf-8", u8.subarray(3));
  else t = dec("utf-8", u8);
  if (t === null && u8.length % 2 === 0) {
    if (u8[0] === 0xff && u8[1] === 0xfe) t = dec("utf-16le", u8.subarray(2));
    else if (u8[0] === 0xfe && u8[1] === 0xff) t = dec("utf-16be", u8.subarray(2));
  }
  if (t === null) t = dec("euc-kr", u8);
  if (t === null) return null;
  return t.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
}

const RE_A1 = pyRe("^\\[(.+?)\\]\\s*(.+)");
const RE_A2 = pyRe("^(.+?)\\s*\\[(.+?)\\]$");
const RE_A3 = pyRe("^(.+?)@(.+)");
const RE_PLUS = gRe(pyRe("[+＋].*$"));
const RE_EPISODE = pyRe("(\\d+-\\d+\\s*(\\(완\\)|완|完|완결)?)$");
const RE_EPISODE_SUB = gRe(pyRe("\\s*\\d+-\\d+\\s*(\\(완\\)|완|完|완결)?$"));

function parseFilename(filename) {
  const name = splitext(filename)[0];
  let author = "알 수 없음", title = name, m;
  if ((m = RE_A1.exec(name))) { author = m[1]; title = m[2]; }
  else if ((m = RE_A2.exec(name))) { title = m[1]; author = m[2]; }
  else if ((m = RE_A3.exec(name))) { title = m[1]; author = m[2]; }
  title = pyStrip(title);
  const forSearch = pyStrip(title.replace(RE_PLUS, ""));
  const ep = RE_EPISODE.exec(title);
  return {
    author: pyStrip(author),
    title,
    cleanTitle: pyStrip(title.replace(RE_EPISODE_SUB, "")),
    cleanTitleForSearch: pyStrip(forSearch.replace(RE_EPISODE_SUB, "")),
    episodeInfo: ep ? pyStrip(ep[1]) : "",
  };
}

// ============================================================================
// 챕터 분할 (split_chapters)
// ============================================================================
const NUM = "[\\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]";
const n = NUM;
const CHAPTER_TAIL = [
  // 화(話)
  String.raw`제?\s*${n}+\s*화(?:\s*\(?\s*(?:완결|완|Complete)\s*\)?)?(?:[\.\s].*)?|`,
  String.raw`[^\w\s]{1,3}\s*${n}+\s*화(?:\s*\(?\s*(?:완결|완|Complete)\s*\)?)?(?:[\.\s].*)?|`,
  // 장(章)
  String.raw`(?:제|第)?\s*${n}+\s*(?:장|章)(?:[\.\s].*)?|`,
  String.raw`^(?:第?\s*[一二三四五六七八九十百千]{1,3}\s*[章回]|[一二三四五六七八九十百千]{1,3}\s*[章回])(?:\s*[\(（]?.{1,50}[\)）]?)?|`,
  // 외전
  String.raw`.*외전(?:\s*${n}+(?:-${n}+)?)?(?:\s*화)?(?:[\.\s].*)?|`,
  // 특수 챕터
  String.raw`[^\w\s]*(?:프롤로그|[Pp]rologue)(?:\s*${n}+)?(?:\s*화)?(?:[\.\s].*)?|`,
  String.raw`[^\w\s]*(?:에필로그|[Ee]pilogue)(?:\s*${n}+)?(?:\s*화)?(?:[\.\s].*)?|`,
  String.raw`(?:서장|序章|[Ii]ntroduction)(?:\s*${n}+)?(?:[\.\s].*)?|`,
  String.raw`(?:종장|終章|[Ff]inal\s*[Cc]hapter)(?:\s*${n}+)?(?:[\.\s].*)?|`,
  String.raw`(?:후일담|後日譚|[Ss]ide\s*[Ss]tory|[Ss]tory)(?:\s*${n}+)?(?:[\.\s].*)?|`,
  String.raw`(?:번외|番外|[Ss]ide\s*[Ss]tory|[Ee]xtra)(?:\s*${n}+)?(?:[\.\s].*)?|`,
  String.raw`(?:[<〈【])?작가\s*후기(?:[>〉】])?(?:\s*${n}+)?(?:[\.\s].*)?|`,
  // 영문
  String.raw`[^\w\s]*(?:[Cc]hapter)(?:\s*${n}+)?(?:\s*화)?(?:[\.\s].*)?|`,
  String.raw`[^\w\s]*(?:[Ee]pisode)(?:\s*${n}+)?(?:\s*화)?(?:[\.\s].*)?|`,
  // 숫자 기반
  String.raw`${n}+(?:-${n}+)?\.\s*(?:.*)?|`,
  // 기타
  String.raw`-\s*${n}+\s*-|`,
  String.raw`^\s*#.*|`,
  String.raw`^【[^】]+】`,
].join("");

const RE_SPACES = /[\u2000-\u200B\u3000\uFEFF]/g;
const RE_MANY_NL = /\n{4,}/g;
const RE_HAS_HWA = pyRe(String.raw`^제?\s*\d+\s*화(?:\s*\(?\s*(?:완결|완|마침|完|fin|Complete)\s*\)?)?(?:[\.\s].*)?$`);
const RE_ENDING_NEG = pyRe(String.raw`^.*(?:화|권|장|chapter|part)\b.*(?:완결|完)`, true);
const RE_ENDING_POS = pyRe(String.raw`^-?\s*.{0,15}(?:完|마침|[Ff]in\.?|완결)\s*-?$`, true);
const RE_H2 = pyRe([
  String.raw`^(`,
  String.raw`[^\d]*${n}+\s*화(?:\s*\(?\s*(?:완결|완|Complete)\s*\)?)?(?:[\.\s].*)?|`,
  String.raw`.*외전(?:[\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ\s]*(?:화|권)?)?(?:[\.\s].*)?|`,
  String.raw`[^\w\s]*(?:프롤로그|[Pp]rologue|에필로그|[Ee]pilogue|[Ee]pisode|후일담|번외|서장|종장).*`,
  String.raw`)\s*$`,
].join(""), true);

/** → [[titles...], content][] (titles[0] = h2, 나머지 h3) */
function splitChapters(text, cleanTitle) {
  text = text.replace(RE_SPACES, " ").replace(RE_MANY_NL, "\n\n\n\n");
  const lines = pySplitlines(text);
  const hasHwaInFile = lines.some((l) => RE_HAS_HWA.test(pyStrip(l)));
  const pattern = pyRe(`^(${reEscape(cleanTitle)} (.*)|${CHAPTER_TAIL})\\s*$`, true);
  const isEnding = (l) => !RE_ENDING_NEG.test(l) && RE_ENDING_POS.test(l);
  const join = (v) => pyStrip(v.join("\n"));

  const chapters = [];
  let titles = [], content = [];
  for (const raw of lines) {
    const line = pyStrip(raw);
    if (!pattern.test(line) || isEnding(line)) { content.push(raw); continue; }
    const newH2 = !hasHwaInFile || RE_H2.test(line);
    if (newH2) {
      if (titles.length) { chapters.push([titles, join(content)]); content = []; }
      else if (content.length) { chapters.push([["(목차 없음)"], join(content)]); content = []; }
      titles = [line];
    } else {
      titles.push(line); // n화 아님 → h3
    }
  }
  if (content.length && titles.length) chapters.push([titles, join(content)]);
  if (!chapters.length) {
    const full = join(lines);
    if (full) chapters.push([["(목차 없음)"], full]);
  }
  return chapters;
}

/** excluded: Set("ci,ti") — h2 제외는 이전 챕터에 합치고, h3 제외는 제목만 뺀다 */
function applyExcludedKeys(chapters, excluded) {
  if (!excluded.size) return chapters.map(([t, c]) => [[...t], c]);
  const out = [];
  chapters.forEach(([titles, content], ci) => {
    const subs = titles.slice(1).filter((_, k) => !excluded.has(`${ci},${k + 1}`));
    if (excluded.has(`${ci},0`)) {
      const prev = out[out.length - 1];
      if (prev) {
        prev[0].push(...subs);
        if (content) prev[1] = `${prev[1]}\n${content}`;
      } else {
        out.push([["(목차 없음)", ...subs], content]);
      }
    } else {
      out.push([[titles[0], ...subs], content]);
    }
  });
  return out;
}

function cssContent(h2, h3) {
  return `
body {

p {

max-width: 100%;

  margin: 0;
  text-indent: 0;
}
h3 {
  font-size: 1.2em;
  text-align: center;
  font-weight: bold;
  line-height: 1.6em;
  color: ${h3};
  padding-bottom: 4em;
  padding-top: 0.1em;
  margin: 0;
  text-indent: 0;

.flashback {
  color: #7F7F7F;
  font-style: italic;
  padding: 0.3em 0.6em 0.3em 0.6em;
  text-indent: 1em;
  margin: 1em 0;
  line-height: 1.8em;
  text-align: justify;
  font-size: 1em;
}

.ridiitalic {
  font-style: italic;
  padding: 0.3em 0.6em 0.3em 0.6em;
  text-indent: 1em;
  margin: 1em 0;
  line-height: 1.8em;
  text-align: justify;
  font-size: 1em;
}

`;
}

// ============================================================================
// EPUB3 엔진 (Rust engine3.rs 이식)
// ============================================================================
const CONTAINER_XML = `<?xml version='1.0' encoding='utf-8'?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
  <rootfiles>

const escapeXml = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&apos;");

function uuid4() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}

function genContentOpf(input, hasCover, count) {
  let manifest = `    <item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>\n`
    + `    <item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>\n`
    + `    <item id="style" href="Styles/style.css" media-type="text/css"/>\n`;
  if (hasCover) {
    manifest += `    <item id="cover_img" href="Images/cover.jpg" media-type="image/jpeg" properties="cover-image"/>\n`
      + `    <item id="cover" href="cover.xhtml" media-type="application/xhtml+xml"/>\n`;
  }
  for (let i = 1; i <= count; i++)
    manifest += `    <item id="chapter${pad4(i)}" href="Text/Section${pad4(i)}.xhtml" media-type="application/xhtml+xml"/>\n`;
  let spine = hasCover ? `    <itemref idref="cover"/>\n` : "";
  for (let i = 1; i <= count; i++) spine += `    <itemref idref="chapter${pad4(i)}"/>\n`;
  const guide = hasCover ? `  <guide>
    <reference type="cover" title="표지" href="cover.xhtml"/>
  </guide>` : "";
  const coverMeta = hasCover ? `
    <meta name="cover" content="cover_img"/>` : "";
  return `<?xml version='1.0' encoding='utf-8'?>
<package xmlns="http://www.idpf.org/2007/opf" unique-identifier="t2p3_id" version="3.0">
  <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
    <dc:title>${escapeXml(input.title)}</dc:title>
    <dc:creator id="creator">${escapeXml(input.author)}</dc:creator>
    <dc:language>ko</dc:language>
    <dc:identifier id="t2p3_id">urn:uuid:${uuid4()}</dc:identifier>${coverMeta}
  </metadata>
  <manifest>
${manifest}  </manifest>
  <spine toc="ncx">
${spine}  </spine>
${guide}
</package>`;
}

function genTocNcx(input, hasCover) {
  let nav = "", po = 1;
  if (hasCover) {
    nav += `    <navPoint id="navPoint-${po}" playOrder="${po}">
      <navLabel><text>표지</text></navLabel>
      <content src="cover.xhtml"/>
    </navPoint>
`;
    po++;
  }
  const depth = input.chapters.some((c) => c.titles.length > 1) ? 2 : 1;
  input.chapters.forEach((ch, i) => {
    const t = escapeXml(ch.titles[0]), sec = pad4(i + 1);
    if (ch.titles.length > 1) {
      nav += `    <navPoint id="navPoint-${po}" playOrder="${po}">
      <navLabel><text>${t}</text></navLabel>
      <content src="Text/Section${sec}.xhtml"/>
      <navPoint id="navPoint-${po}-1" playOrder="${po}-1">
        <navLabel><text>${escapeXml(ch.titles[1])}</text></navLabel>
        <content src="Text/Section${sec}.xhtml#toc_1"/>
      </navPoint>
    </navPoint>
`;
    } else {
      nav += `    <navPoint id="navPoint-${po}" playOrder="${po}">
      <navLabel><text>${t}</text></navLabel>
      <content src="Text/Section${sec}.xhtml"/>
    </navPoint>
`;
    }
    po++;
  });
  return `<?xml version='1.0' encoding='utf-8'?>
<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1" xml:lang="ko">
  <head>
    <meta name="dtb:uid" content="urn:uuid:${uuid4()}"/>
    <meta name="dtb:depth" content="${depth}"/>
    <meta name="dtb:totalPageCount" content="0"/>
    <meta name="dtb:maxPageNumber" content="0"/>
  </head>
  <docTitle><text>${escapeXml(input.title)}</text></docTitle>
  <navMap>
${nav}  </navMap>
</ncx>`;
}

const SEPARATORS = ["*", "**", "***", "* * *", "＊", "＊＊", "＊＊＊", "＊ ＊ ＊", "❖❖❖", "❖ ❖ ❖", "▪▪▪", "▪ ▪ ▪", "+++", "+ + +"];

function processLine(line) {
  line = line.trim();
  if (!line) return "";
  if (SEPARATORS.includes(line)) {
    const f = line.replace(/\*/g, "* ").replace(/＊/g, "＊ ").replace(/▪/g, "▪ ").replace(/❖/g, "❖ ");
    return `<p class="center">${f.trim()}</p>`;
  }
  if (line.startsWith("〈") || line.startsWith("《")) return `<p class="flashback">${escapeXml(line)}</p>`;
  if (line.startsWith("-") || line.startsWith("─") || line.startsWith("―")) {
    const c = line.startsWith("-") ? `― ${line.slice(1)}` : line;
    return `<p class="ridiitalic">${escapeXml(c)}</p>`;
  }
  return `<p>${escapeXml(line)}</p>`;
}

const RE_BODY_CHAPTER = pyRe(String.raw`^(?:제?\s*[\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+\s*화(?:\s*\(?\s*(?:완결|완|Complete)\s*\)?)?(?:[.\s].*)?|[^\w\s]{1,3}\s*[\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+\s*화(?:\s*\(?\s*(?:완결|완|Complete)\s*\)?)?(?:[.\s].*)?|(?:제|第)?\s*[\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+\s*(?:장|章)(?:[.\s].*)?|.*외전(?:\s*[\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+(?:-[\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+)?)?(?:\s*화)?(?:[.\s].*)?|[^\w\s]*(?:프롤로그|prologue)(?:\s*[\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+)?(?:\s*화)?(?:[.\s].*)?|[^\w\s]*(?:에필로그|epilogue)(?:\s*[\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+)?(?:\s*화)?(?:[.\s].*)?|(?:서장|종장|후일담|번외|작가\s*후기|chapter|episode)(?:\s*[\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+)?(?:[.\s].*)?|[\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+(?:-[\dⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+)?\.(?:\s.*)?|【[^】]+】)\s*$`, true, true);

/** Rust "s.trim_end_matches('.').parse::<u32>().is_ok()" */
function isU32(s) {
  if (!/^\+?[0-9]+$/.test(s)) return false;
  return Number(s.replace(/^\+/, "")) <= 4294967295;
}

function genChapterXhtml(ch) {
  const titleHtml = ch.titles.length === 1
    ? `<h2>${escapeXml(ch.titles[0])}</h2>`
    : `<h2>${escapeXml(ch.titles[0])}</h2><h3 id="toc_1">${escapeXml(ch.titles[1])}</h3>`;

  // 단락 분리 (앞 빈 줄 수 따로)
  const paragraphs = [], gaps = [];
  let current = [], blank = 0;
  const lines = ch.content.split("\n");
  if (lines.length && lines[lines.length - 1] === "") lines.pop();
  for (const l of lines) {
    if (!l.trim()) {
      if (current.length) { paragraphs.push(current); gaps.push(blank); current = []; blank = 0; }
      blank++;
    } else current.push(l);
  }
  if (current.length) { paragraphs.push(current); gaps.push(blank); }

  const body = [];
  let prevFlash = false, prevSep = false;
  const pushFlash = (para) => {
    for (let l of para) { l = l.trim(); if (l) body.push(`<p class="flashback">${escapeXml(l)}</p>`); }
  };
  paragraphs.forEach((para, i) => {
    const blanks = gaps[i];
    const first = para[0].trim();
    const isBigBreak = blanks >= 3 && i > 0;
    const isFlashChar = first.startsWith("“") || first.startsWith("‘");
    const isSep = SEPARATORS.includes(first);
    const isSkipStar = first.startsWith("[") || first.endsWith("]") || first.startsWith("-")
      || first.startsWith("─") || first.startsWith("―") || first.startsWith("━") || first.startsWith("–");
    const isHeading = RE_BODY_CHAPTER.test(first);

    if (isBigBreak && !isHeading && !isSep && !isSkipStar) {
      if (isFlashChar) {
        pushFlash(para);
        prevFlash = true; prevSep = false;
        return;
      } else if (!prevFlash && !prevSep) {
        const next = paragraphs[i + 1];
        let nextIsChapter = false;
        if (next) {
          const s = next[0].trim();
          nextIsChapter = isU32(s.replace(/\.+$/, "")) && s.endsWith(".");
        }
        if (!nextIsChapter) body.push(`<p class="center">*</p>`);
      }
    }
    if (prevFlash && isFlashChar) {
      pushFlash(para);
      prevSep = false;
      return;
    }
    for (const l of para) { const h = processLine(l); if (h) body.push(h); }
    prevFlash = false;
    prevSep = isSep;
  });

  const flashCount = body.filter((s) => s.includes(`class="flashback"`)).length;
  const xhtml = `<?xml version='1.0' encoding='utf-8'?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="ko">
<head>
  <title>${escapeXml(ch.titles[0])}</title>
  <link rel="stylesheet" type="text/css" href="../Styles/style.css"/>
</head>
<body>
${titleHtml}
${body.join("\n")}
</body>
</html>`;
  return [xhtml, flashCount];
}

/** input = {title, author, cover: Uint8Array|null, chapters: [{titles, content}], css} → Blob */
async function createEpub(input) {
  const enc = new TextEncoder();
  const files = [];
  const add = (name, data, store = false) => files.push({ name, data: typeof data === "string" ? enc.encode(data) : data, store });
  add("mimetype", "application/epub+zip", true);
  add("META-INF/container.xml", CONTAINER_XML);
  const hasCover = !!input.cover;
  if (hasCover) {
    add("OEBPS/Images/cover.jpg", input.cover);
    add("OEBPS/cover.xhtml", COVER_XHTML);
  }
  add("OEBPS/Styles/style.css", input.css);
  const results = input.chapters.map(genChapterXhtml);
  const totalFlash = results.reduce((a, [, c]) => a + c, 0);
  results.forEach(([x], i) => {
    // 회색 기울기 문단이 500 넘으면 전부 일반 문단으로
    add(`OEBPS/Text/Section${pad4(i + 1)}.xhtml`, totalFlash > 500 ? x.split(`<p class="flashback">`).join("<p>") : x);
  });
  add("OEBPS/content.opf", genContentOpf(input, hasCover, input.chapters.length));
  add("OEBPS/toc.ncx", genTocNcx(input, hasCover));
  add("OEBPS/nav.xhtml", genNavXhtml(input, hasCover));
  return { blob: await zipFiles(files), totalFlash };
}

// ============================================================================
// ZIP (deflate-raw = CompressionStream, 시각 2011-11-11 11:11:11 고정)
// ============================================================================
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[i] = c >>> 0; }
  return t;
})();
function crc32(d) { let c = 0xffffffff; for (let i = 0; i < d.length; i++) c = CRC_TABLE[(c ^ d[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
async function deflateRaw(data) {
  const s = new Blob([data]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function zipFiles(files) {
  const DOS_TIME = (11 << 11) | (11 << 5) | (11 >> 1), DOS_DATE = ((2011 - 1980) << 9) | (11 << 5) | 11;
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name);
    const crc = crc32(f.data);
    const comp = f.store ? f.data : await deflateRaw(f.data);
    const method = f.store ? 0 : 8;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, method, true); lh.setUint16(10, DOS_TIME, true); lh.setUint16(12, DOS_DATE, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, comp.length, true); lh.setUint32(22, f.data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, name, comp);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, method, true); ch.setUint16(12, DOS_TIME, true); ch.setUint16(14, DOS_DATE, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, comp.length, true); ch.setUint32(24, f.data.length, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(ch.buffer, name);
    offset += 30 + name.length + comp.length;
  }
  const cdSize = central.reduce((a, p) => a + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: "application/epub+zip" });
}

async function loadBitmap(blob) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(blob); } catch { /* 아래로 */ }
  }
  const url = URL.createObjectURL(blob);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    return img;
  } finally { URL.revokeObjectURL(url); }
}
/** PIL convert("RGB").save(JPEG, quality) */
async function toJpeg(blob, quality) {
  const bmp = await loadBitmap(blob);
  const w = bmp.width, h = bmp.height;
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, w, h);
  g.drawImage(bmp, 0, 0);
  const out = await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error("JPEG 변환 실패"))), "image/jpeg", quality));
  return new Uint8Array(await out.arrayBuffer());
}

/** 서버에서 표지 찾기 → Blob (없으면 null). log(text, tone, small) */
async function fetchCover(mode, filename, log) {
  const base = (API || location.origin).replace(/\/+$/, "");
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 60000);
  let d;
  try {
    const r = await fetch(`${base}/cover?m=${encodeURIComponent(mode)}&n=${encodeURIComponent(filename)}`, { signal: ctl.signal });
    if (!r.ok) throw new Error(`서버 오류 (HTTP ${r.status})`);
    d = await r.json();
  } catch (e) {
    throw new Error(e.name === "AbortError" ? "시간 초과" : e.message === "Failed to fetch" ? "서버에 연결할 수 없습니다" : e.message);
  } finally { clearTimeout(timer); }
  for (const [t, tone, small] of d.lines || []) log(t, tone, small);
  if (d.error) throw new Error(d.error);
  if (!d.img) return null;
  const bin = atob(d.img);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], { type: d.type || "image/jpeg" });
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function addLine(parts, small = false, indent = 0) {
  const p = el("p", small ? "sm" : "");
  if (indent) p.style.paddingLeft = indent + "px";
  for (const [t, cls, bold] of parts) {
    const s = el(bold ? "b" : "span", cls ? "c-" + cls : "", t);
    p.append(s);
  }
  $("preview").append(p);
  $("preview").scrollTop = $("preview").scrollHeight;
  return p;
}
const log = (text, tone, small) => addLine([[text, tone]], small);

function updatePreview() {
  if (S.txtText == null) return;
  const name = S.txtFile.name;
  const p = parseFilename(name);
  S.chapters = splitChapters(S.txtText, p.cleanTitle);
  const filtered = applyExcludedKeys(S.chapters, S.excluded);
  const exc = S.chapters.length - filtered.length;
  $("preview").innerHTML = "";
  addLine([["📄 파일:", "blue", true], [" " + name, "blue"]]);
  addLine([["👤 작가:", "", true], [" " + p.author]]);
  addLine([["📖 제목:", "", true], [" " + p.cleanTitle]]);
  const cnt = [["📚 챕터 수:", "", true], [` ${filtered.length}개`]];
  if (exc > 0) cnt.push([` (제외: ${exc}개)`, "red"]);
  addLine(cnt);
  $("preview").append(el("hr"));
  addLine([["목차 미리보기:", "gray", true]]);
  const frag = document.createDocumentFragment();
  filtered.forEach(([titles], i) => {
    const a = el("p", "", `Section${pad4(i + 1)} → ${titles[0]}`); a.style.paddingLeft = "5px"; frag.append(a);
    for (const sub of titles.slice(1)) { const b = el("p", "c-dgray", `└ ${sub}`); b.style.paddingLeft = "25px"; frag.append(b); }
  });
  $("preview").append(frag);
  $("preview").scrollTop = 0;
}

function setBusy(b) {
  S.busy = b;
  document.body.classList.toggle("busy", b);
  for (const id of ["txtBtn", "imgBtn", "h2Btn", "h3Btn", "tocBtn", "fetchBtn", "resetBtn", "convertBtn"]) $(id).disabled = b;
}

async function setTxt(file) {
  const text = decodeText(await file.arrayBuffer());
  if (text == null) { alert(`인코딩 실패: ${file.name}`); return; }
  S.txtFile = file; S.txtText = text;
  $("txtName").textContent = file.name; $("txtName").classList.add("on");
  updatePreview();
  if (S.mode) runFetch();
}

async function setImg(blob, name) {
  try { await loadBitmap(blob); } catch { alert("이미지를 읽을 수 없습니다."); return false; }
  S.imgBlob = blob; S.imgName = name;
  if (S.imgUrl) URL.revokeObjectURL(S.imgUrl);
  S.imgUrl = URL.createObjectURL(blob);
  $("imgName").textContent = name; $("imgName").classList.add("on");
  $("cover").innerHTML = "";
  const img = el("img"); img.src = S.imgUrl; img.alt = "표지";
  $("cover").append(img);
  return true;
}

const isTxt = (f) => /\.txt$/i.test(f.name);
const isImg = (f) => /\.(png|jpe?g|webp)$/i.test(f.name);

async function onFiles(files) {
  files = [...files];
  const txts = files.filter(isTxt);
  if (txts.length > 1) { alert(`TXT 파일은 한 개만 선택해주세요.\n현재 선택: ${txts.length}개`); return; }
  for (const f of files) {
    if (isTxt(f)) await setTxt(f);
    else if (isImg(f)) await setImg(f, f.name);
  }
}

async function runFetch() {
  if (!S.txtFile) { alert("TXT 파일을 먼저 선택해주세요."); return; }
  if (!S.mode) { alert("표지 찾기 모드를 먼저 설정해주세요."); return; }
  setBusy(true);
  try {
    const blob = await fetchCover(S.mode, S.txtFile.name, log);
    if (blob) await setImg(blob, `cover_${S.mode}.jpg (${modeName(S.mode)})`);
  } catch (e) {
    log(`❌ 오류: ${e.message}`, "red");
    alert(`표지 검색 중 오류가 발생했습니다:\n\n${e.message}`);
  } finally { setBusy(false); }
}

async function runConvert() {
  if (!S.txtFile) { alert("TXT 파일을 선택해주세요."); return; }
  setBusy(true);
  try {
    const p = parseFilename(S.txtFile.name);
    const chapters = applyExcludedKeys(splitChapters(S.txtText, p.cleanTitle), S.excluded);
    let cover = null;
    if (S.imgBlob) {
      try { cover = await toJpeg(S.imgBlob, 0.65); } catch (e) { log(`⚠️ 표지 압축 실패 (표지 없이 변환): ${e.message}`, "orange"); }
    }
    const { blob } = await createEpub({
      title: p.title, author: p.author, cover,
      css: cssContent(S.h2, S.h3),
      chapters: chapters.map(([titles, content]) => ({ titles, content })),
    });
    const outName = sanitizeFilename(`[${p.author}] ${p.title}.epub`);
    const a = el("a"); a.href = URL.createObjectURL(blob); a.download = outName;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    log(`✅ EPUB 변환 완료: ${outName} (${(blob.size / 1024).toFixed(0)} KB)`, "green");
  } catch (e) {
    console.error(e);
    log(`❌ EPUB 변환 실패: ${e.message}`, "red");
    alert("EPUB 변환에 실패했습니다.");
  } finally { setBusy(false); }
}

function resetAll() {
  S.txtFile = null; S.txtText = null; S.imgBlob = null; S.imgName = ""; S.mode = null;
  S.excluded = new Set(); S.chapters = []; S.h2 = "#000000"; S.h3 = "#000000";
  if (S.imgUrl) URL.revokeObjectURL(S.imgUrl); S.imgUrl = null;
  $("txtName").textContent = "TXT 파일을 선택하거나 끌어다 놓으세요"; $("txtName").classList.remove("on");
  $("imgName").textContent = "표지 이미지 (선택 / 끌어다 놓기 / Ctrl+V)"; $("imgName").classList.remove("on");
  $("cover").textContent = "표지 없음";
  $("txtFile").value = ""; $("imgFile").value = "";
  paintSwatches(); showHelp();
  alert("전체 상태가 초기화되었습니다.");
}

function paintSwatches() { $("h2Sw").style.background = S.h2; $("h3Sw").style.background = S.h3; }

// --- 표지 찾기 다이얼로그 ---
function openCoverDlg() {
  const box = $("coverRadios"); box.innerHTML = "";
  for (const [k, label] of COVER_MODES) {
    const l = el("label"); const r = el("input"); r.type = "radio"; r.name = "cmode"; r.value = k; r.checked = S.mode === k;
    r.addEventListener("dblclick", () => $("coverOk").click());
    l.append(r, " " + label); box.append(l);
  }
  $("coverDlg").showModal();
}
$("coverOk").onclick = () => {
  const r = document.querySelector('input[name="cmode"]:checked');
  if (!r) { alert("플랫폼을 선택하세요."); return; }
  $("coverDlg").close();
  S.mode = r.value;
  log(`🌐 표지 찾기 모드: ${modeName(S.mode)}`, "green");
  if (S.txtFile) runFetch();
  else alert("표지 찾기 모드가 설정되었습니다.\n\nTXT 파일을 선택하면 자동으로 표지를 검색합니다.");
};
$("coverOff").onclick = () => { $("coverDlg").close(); S.mode = null; log("🗑️ 표지 찾기 설정 해제", "orange"); };

// --- 목차 편집 다이얼로그 ---
function openExDlg() {
  if (!S.chapters.length) {
    if (!S.txtFile) { alert("먼저 TXT 파일을 선택해주세요."); return; }
    updatePreview();
  }
  if (!S.chapters.length) { alert("감지된 챕터가 없습니다."); return; }
  const list = $("exList"); list.innerHTML = "";
  const frag = document.createDocumentFragment();
  S.chapters.forEach(([titles], ci) => {
    const row = (key, label, h3) => {
      const l = el("label", h3 ? "h3" : "h2"); const c = el("input"); c.type = "checkbox"; c.dataset.key = key; c.checked = S.excluded.has(key);
      l.append(c, " " + label); frag.append(l);
    };
    row(`${ci},0`, `Section${pad4(ci + 1)} → ${titles[0] || "(목차 없음)"}`, false);
    titles.slice(1).forEach((sub, k) => row(`${ci},${k + 1}`, `└ ${sub}`, true));
  });
  list.append(frag);
  $("exDlg").showModal();
}
const exChecks = () => [...$("exList").querySelectorAll("input[type=checkbox]")];
$("exAll").onclick = () => exChecks().forEach((c) => (c.checked = true));
$("exNone").onclick = () => exChecks().forEach((c) => (c.checked = false));
$("exApply").onclick = () => { S.excluded = new Set(exChecks().filter((c) => c.checked).map((c) => c.dataset.key)); $("exDlg").close(); updatePreview(); };
$("exReset").onclick = () => { S.excluded = new Set(); $("exDlg").close(); updatePreview(); };
$("exClose").onclick = () => $("exDlg").close();

// --- 버튼 ---
$("txtBtn").onclick = () => $("txtFile").click();
$("imgBtn").onclick = () => $("imgFile").click();
$("txtFile").onchange = (e) => { if (e.target.files[0]) setTxt(e.target.files[0]); };
$("imgFile").onchange = (e) => { const f = e.target.files[0]; if (f) setImg(f, f.name); };
$("h2Btn").onclick = () => { if (!S.txtFile) return alert("TXT 파일을 업로드해주세요."); $("h2Pick").value = S.h2; $("h2Pick").click(); };
$("h3Btn").onclick = () => {
  if (!S.txtFile) return alert("TXT 파일을 업로드해주세요.");
  if (!S.chapters.some(([t]) => t.length >= 2)) return alert("소목차가 없습니다.");
  $("h3Pick").value = S.h3; $("h3Pick").click();
};
$("h2Pick").oninput = (e) => { S.h2 = e.target.value.toUpperCase(); paintSwatches(); };
$("h3Pick").oninput = (e) => { S.h3 = e.target.value.toUpperCase(); paintSwatches(); };
$("tocBtn").onclick = openExDlg;
$("fetchBtn").onclick = openCoverDlg;
$("resetBtn").onclick = resetAll;
$("convertBtn").onclick = runConvert;

// --- 드래그 앤 드롭 / 붙여넣기 ---
let dragDepth = 0;
document.addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; $("app").classList.add("drop"); });
document.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("app").classList.remove("drop"); } });
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => {
  e.preventDefault(); dragDepth = 0; $("app").classList.remove("drop");
  if (!S.busy && e.dataTransfer.files.length) onFiles(e.dataTransfer.files);
});
document.addEventListener("paste", async (e) => {
  if (S.busy || document.querySelector("dialog[open]") || e.target.tagName === "INPUT") return;
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find((i) => i.type.startsWith("image/"));
  if (!item) { alert("클립보드에 이미지가 없습니다."); return; }
  e.preventDefault();
  const blob = item.getAsFile();
  if (blob && (await setImg(blob, "clipboard_cover.jpg"))) log("🖼️ 표지 설정: 클립보드 이미지 (clipboard_cover.jpg)", "green");
});

paintSwatches();
showHelp();
</script>
</body>
</html>
